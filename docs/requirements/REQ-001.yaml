# 出典: 「新島info Instagram自動投稿システム 要件定義書」（2026-10-01）5章 F-01〜F-06 / 6章 / 9章
id: REQ-001
title: 予約投稿が確実に動く土台（フェーズ1）
status: approved   # 2026-10-01 梶原が承認
background: |
  新島info（同志社の現役生が運営するInstagramメディア）は、投稿作業を手作業で行っている。
  まず「ログインして、画像とキャプションを用意し、日時を指定すれば、その日時に公開される」ことを
  無料枠だけで確実に回す。AI生成（REQ-002）・承認フロー（REQ-003）はこの土台の上に積む。
actors: [管理者（京愛）, 承認者（新島info幹部）, 編集者（新島info運営メンバー）, 定期処理]

concerns:
  - 予約した投稿が、予約日時から15分程度の遅れの範囲で、確実に公開されること
  - 同じ投稿が二重に公開されないこと
  - 失敗したときに、理由が分かり、画面から再実行できること
  - トークン切れなど「気づかないうちに止まっている」状態を作らないこと
  - Instagramのパスワードやアクセストークンを誰にも見せないこと
  - スマホで迷わず操作できること

business_rules:
  - id: BR-001-01
    rule: 管理画面を使えるのは、許可リストに載った有効なメンバーだけ。ロールは管理者・承認者・編集者の3つ。メンバーの追加・無効化・ロール変更は承認者以上が行い、管理者ロールの付与・変更は管理者だけが行う
    terms: [メンバー, ロール, 団体]
  - id: BR-001-02
    rule: Instagram連携は1団体に1つ。OAuthで得たアクセストークンは暗号化して保存し、画面・ログに出さない
    terms: [Instagram連携, アクセストークン, 団体]
  - id: BR-001-03
    rule: 投稿画像は画像仕様（JPEG、8MB以下、アスペクト比4:5〜1.91:1、幅320〜1440px）を満たす形に、アップロード時に自動で変換する
    terms: [投稿画像, 画像仕様]
  - id: BR-001-04
    rule: 投稿種別が画像なら投稿画像は1枚、カルーセルなら2〜10枚。カルーセルは全画像を1枚目のアスペクト比にそろえる
    terms: [投稿, 投稿種別, 投稿画像一覧]
  - id: BR-001-05
    rule: キャプションは2,200文字以下、ハッシュタグは30個以下。PR区分がPR案件なら公開時に先頭へPR表記を付け、付けた後も2,200文字以下であること
    terms: [キャプション, ハッシュタグ, PR区分]
  - id: BR-001-06
    rule: 予約日時は確定時点で現在より後、かつ1年以内。予約の確定（承認）は承認者・管理者だけができる
    terms: [予約日時, ロール, 投稿]
  - id: BR-001-07
    rule: 投稿状態は投稿履歴から導出し、遷移表にない遷移は許さない
    terms: [投稿状態, 投稿履歴]
  - id: BR-001-08
    rule: 定期処理は15分ごとに、予約日時を過ぎた予約中の投稿を公開する。予約日時から公開猶予（既定6時間）を過ぎていたら公開せず失敗（公開猶予切れ）にする
    terms: [予約日時, 公開猶予, 投稿状態, 失敗区分]
  - id: BR-001-09
    rule: 一時的なエラーは同じジョブ内で最大3回まで間隔を空けてリトライする。上限超過は予約中に戻して次の定期処理に回す（公開延期）。ジョブの最大試行回数（4回）を使い切ったら、失敗理由を記録して失敗にする
    terms: [失敗区分, 失敗理由, ジョブ]
  - id: BR-001-10
    rule: 同じ投稿の公開は同時に1つの処理しか実行しない。公開処理中で中断した投稿は、Instagram側の状態を確かめてから公開済みか失敗かを決める
    terms: [ジョブ, ジョブ状態, 投稿状態, 公開結果]
  - id: BR-001-11
    rule: トークン有効期限は毎日確認し、残り30日以下なら更新する。残り14日以下か更新失敗なら警告を出し、残り7日以下で更新にも失敗したらワークフローを失敗させて管理者にメールを届ける
    terms: [トークン有効期限, Instagram連携, 警告]
  - id: BR-001-12
    rule: 警告（トークン期限・更新失敗・未連携・生成上限・投稿失敗・定期処理の停止）はログイン時にバナーで表示する。定期処理の停止は最後のバッチ稼働記録から60分以上経過で判定する
    terms: [警告, バッチ稼働記録]

acceptance_criteria:
  - id: AC-001-01
    given: 許可リストにないGoogleアカウント
    when: ログインする
    then: 「利用が許可されていません」と表示され、どのデータも読めない
  - id: AC-001-02
    given: 無効化されたメンバー
    when: ログインする
    then: AC-001-01 と同じ扱いになる
  - id: AC-001-03
    given: 管理者がInstagram連携ボタンからOAuthを完了した
    when: 設定画面を開く
    then: 連携中のIGユーザー名とトークン有効期限が表示され、アクセストークンは画面・APIレスポンスのどこにも含まれない
  - id: AC-001-04
    given: 幅4032×高さ3024（4:3）、5MBのHEIC由来JPEGを選んだ
    when: 画像投稿としてアップロードする
    then: 幅1440以下のJPEG・8MB以下に変換され、アスペクト比は1.91:1〜4:5の範囲に収まる
  - id: AC-001-05
    given: 縦長9:16の画像を選んだ
    when: アップロードする
    then: 4:5に中央トリミングされる（トリミング位置は画面で調整できる）
  - id: AC-001-06
    given: カルーセルで1枚目が4:5、2枚目が1:1
    when: アップロードする
    then: 2枚目も4:5にそろえられる
  - id: AC-001-07
    given: カルーセルに画像1枚 / 2枚 / 10枚 / 11枚
    when: 承認を依頼する
    then: 1枚と11枚は「カルーセルは2〜10枚です」で拒否、2枚と10枚は受け付ける
  - id: AC-001-08
    given: キャプション2,200文字 / 2,201文字 / ハッシュタグ31個
    when: 保存する
    then: 2,200文字は保存でき、2,201文字とハッシュタグ31個はエラー
  - id: AC-001-09
    given: PR区分=PR案件、キャプション2,196文字、PR表記が「【PR】」+改行（5文字）   # 2026-10-02 文字数の計算誤りを訂正（6→5文字）
    when: 承認を依頼する
    then: 公開用キャプションが2,201文字になるため「PR表記を含めて2,200文字以内にしてください」で拒否される
  - id: AC-001-10
    given: 編集者
    when: 承認待ちの投稿を予約に確定しようとする
    then: 操作できない（ボタンが出ず、APIも403相当で拒否）
  - id: AC-001-11
    given: 過去の日時 / 現在+1分 / 現在+366日
    when: 予約日時として確定する
    then: 過去と366日後は拒否、現在+1分は受け付ける
  - id: AC-001-12
    given: 予約日時が10:00の予約中の投稿
    when: 10:00〜10:15の間の定期処理が走る
    then: 投稿が公開され、投稿状態は公開済み、メディアIDとパーマリンクが記録される
  - id: AC-001-13
    given: 予約日時から6時間1分経過した予約中の投稿（定期処理が止まっていた）
    when: 定期処理が走る
    then: 公開されず、失敗（公開猶予切れ）になる
  - id: AC-001-14
    given: 予約中の投稿に対し、定期処理が2つ同時に起動した
    when: 両方が公開ジョブを取りに行く
    then: 実行権を取れるのは1つだけで、Instagramへの公開APIは1回しか呼ばれない
  - id: AC-001-15
    given: 公開APIを呼んだ直後に処理が落ち、投稿が公開処理中のまま残った
    when: 次の定期処理が走る
    then: コンテナの状態を確認し、公開済みならメディアIDを取得して公開済みに、未公開なら公開をやり直す。二重公開しない
  - id: AC-001-16
    given: Instagram APIが500を2回返し3回目に成功する
    when: 公開する
    then: 公開済みになり、ジョブの試行結果に同じ試行内の再試行が2回と記録される
  - id: AC-001-17
    given: Instagram APIがトークン無効（OAuthException code 190）を返す
    when: 公開する
    then: リトライせず失敗（連携切れ）になり、失敗理由に「Instagram連携をやり直してください」が出る
  - id: AC-001-18
    given: 失敗した投稿
    when: 承認者が再実行を押す（予約日時は「今すぐ」または新しい日時）
    then: 予約中に戻り、次の定期処理で公開される
  - id: AC-001-19
    given: トークン有効期限の残りが31日 / 30日
    when: 日次処理が走る
    then: 31日は更新しない、30日は更新して有効期限が延びる
  - id: AC-001-20
    given: 残り7日でトークン更新が失敗した
    when: 日次処理が走る
    then: ワークフローが失敗状態で終了し、ログイン時に「トークン更新失敗」の警告が出る
  - id: AC-001-21
    given: 最後のバッチ稼働記録が61分前
    when: ログインする
    then: 「定期処理が止まっています」の警告が出る
  - id: AC-001-22
    given: 予約中・公開済み・失敗の投稿がある月
    when: 投稿カレンダーを開く
    then: 状態ごとに色分けされ、失敗の投稿には理由と再実行ボタンが出る

  - id: AC-001-23
    given: 承認者がメンバー一覧を開いている
    when: 新しいメンバーを編集者として招待する / 既存メンバーに管理者ロールを付与しようとする
    then: 編集者の招待はできる。管理者ロールは選択肢に出ず、RPCでも拒否される

non_functional:
  - id: NFR-001-01
    requirement: ランニングコスト月額0円。各サービスの無料枠を超える設定（課金の有効化）をしない
    verify_by: review
  - id: NFR-001-02
    requirement: 下書きの確認から予約まで3タップ程度で完了する（スマホ幅375pxで横スクロールなし）
    verify_by: test
  - id: NFR-001-03
    requirement: アクセストークンは保存時にAES-256-GCMで暗号化し、ログ・APIレスポンスに平文が出ない
    verify_by: test
  - id: NFR-001-04
    requirement: 同一投稿の公開処理は排他され、二重公開しない（冪等）
    verify_by: test
  - id: NFR-001-05
    requirement: 他団体のデータは行レベルセキュリティで読み書きできない
    verify_by: test
  - id: NFR-001-06
    requirement: 定期処理の停止は60分以内に管理画面で分かる
    verify_by: test

out_of_scope:
  - リール・ストーリーズ（将来 F-19）
  - プッシュ通知（状態は管理画面で確認する）
  - 他団体への提供（将来 F-20。データには団体IDを先に持たせる）
  - リンク・投票・位置情報などのスタンプ（APIで使えない）

# 前提（フェーズ0で検証する。外れたら要件・設計を直す。2026-10-01 梶原の判断で、検証を待たずに実装へ進む）
assumptions:
  - 新島infoがInstagramアカウントをビジネス／クリエイターへ切り替えることに合意する（要件13章）
  - Meta開発者アプリ（開発モード＋テスター）の「Instagramログイン」方式で、投稿・トークン更新ができる（ADR-0003）
  - 画像はJPEGのみ、カルーセル上限10枚、24時間の公開数上限100件（02_外部連携設計。フェーズ0手順 A2〜A6）
open_questions: []
# 決定済み（2026-10-01 梶原）:
#   - メンバーの追加・削除は新島info側（承認者ロール）が行う。管理者ロールの付与だけは京愛（管理者）
#   - フェーズ0の確認事項（テスト投稿・Gemini規約・過去投稿の提供・ベースライン計測）は後日設定。いったん保留
#   - リポジトリは公開（ADR-0001）
#   - フェーズ1から予約の確定は承認者・管理者のみ。編集者は承認依頼まで
#   - 公開猶予6時間、トークン更新・警告・ワークフロー失敗の日数 30/14/7日、PR表記「【PR】」は仮置きで進める（運用で見直す）
