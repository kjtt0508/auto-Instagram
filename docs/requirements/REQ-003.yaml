# 出典: 「新島info Instagram自動投稿システム 要件定義書」（2026-10-01）5章 F-12〜F-16 / 4章 業務フロー
id: REQ-003
title: ネタ箱・AI企画・自動チェック・承認フロー・PR入稿（フェーズ3）
status: draft
background: |
  人が関わるのを「ネタの投入」と「承認」の2点だけにする。ネタを一言メモで入れればAIが投稿の構成まで作り、
  機械的に分かる誤り（PR表記漏れ、日付と曜日の矛盾など）は自動で警告し、承認者は確認と承認だけを行う。
  サークル・企業からのPR掲載依頼は、DMではなく入稿フォームで受ける。
actors: [編集者, 承認者, 管理者, PR入稿者（サークル・企業）, Gemini API]

concerns:
  - ネタを思いついたときにスマホで一言入れられること
  - 承認者が「何を確認すればよいか」がすぐ分かること
  - PR案件のPR表記が漏れないこと（ステマ規制）
  - PR入稿者の個人情報が守られること、フォームがスパムで荒らされないこと
  - 承認されたものだけが公開されること

business_rules:
  - id: BR-003-01
    rule: ネタは1〜2,000文字の本文と出どころを持つ。運営メモは編集者以上が投入できる
    terms: [ネタ, ネタの出どころ, ロール]
  - id: BR-003-02
    rule: AI企画生成は、ネタと伸びた投稿（直近90日、リーチあたり保存数の上位3件）を入力に、スライド構成・キャプション・ハッシュタグを一括で作り、投稿（下書き）にする
    terms: [ネタ, 伸びた投稿, 下書き案, 投稿, 生成]
  - id: BR-003-03
    rule: 自動チェックは承認依頼時と承認画面表示時に行う。画像仕様違反はエラーとして承認できない。PR案件の可能性（PR区分が通常なのに「提供」「協賛」「PR」等を含む）・日付と曜日の矛盾・個人名の可能性・NG表現・参照元URLなしは注意として表示し、承認は止めない。PR表記そのものは公開時にPR区分から自動付与する
    terms: [自動チェック, チェック項目, チェック結果, NG表現, PR区分]
  - id: BR-003-04
    rule: 編集者が承認を依頼し、承認者または管理者が承認（予約の確定）か修正指示を行う。承認された投稿だけが予約中になる
    terms: [投稿, 投稿状態, ロール, 修正指示]
  - id: BR-003-05
    rule: 修正指示を出すと投稿は下書きに戻り、指示を入力にAIが再生成する
    terms: [修正指示, 投稿状態, 生成]
  - id: BR-003-06
    rule: PR入稿はログイン不要のフォームで受ける。文面1〜2,000文字、画像0〜10枚、希望日、入稿者連絡先。ボット対策を通ったものだけ受け付ける
    terms: [PR入稿, 入稿者連絡先]
  - id: BR-003-07
    rule: PR入稿を採用するとネタ（出どころ=PR入稿）が作られ、そこから作る投稿のPR区分は必ずPR案件になり、通常へ変更できない
    terms: [PR入稿, 採否, ネタ, ネタの出どころ, PR区分]
  - id: BR-003-08
    rule: 入稿者連絡先は管理画面で承認者以上だけが見られ、LLMには渡さない
    terms: [入稿者連絡先, ロール]
  - id: BR-003-09
    rule: 投稿にはジャンルを1つ付ける（分析で使う）。下書きのうちは未選択でもよいが、承認依頼時には必須
    terms: [投稿, ジャンル]

acceptance_criteria:
  - id: AC-003-01
    given: 編集者がスマホでネタ箱を開いている
    when: 「12/1 履修登録締切」と入力して送る
    then: ネタ（出どころ=運営メモ）が登録され、一覧の先頭に出る
  - id: AC-003-02
    given: ネタ本文が0文字 / 2,001文字
    when: 送る
    then: どちらもエラーで登録されない
  - id: AC-003-03
    given: ネタと、インサイトのある公開済み投稿が5件
    when: AI企画生成を実行する
    then: 伸びた投稿の上位3件を例に含めて生成し、スライド構成・キャプション・ハッシュタグを持つ投稿（下書き）ができる
  - id: AC-003-04
    given: PR区分=通常で、キャプションに「○○株式会社 提供」を含む投稿
    when: 承認依頼時に自動チェックを行う
    then: 「PR案件の可能性があります。PR区分を確認してください」が注意として出る。PR区分=PR案件なら出ない
  - id: AC-003-05
    given: キャプションに「11月3日（火）」とあり、11/3が月曜日の年
    when: 自動チェックを行う
    then: 「日付と曜日が合っていません（11月3日は月曜日）」が注意として出るが、承認はできる
  - id: AC-003-06
    given: キャプションに団体のNG表現「最強」が含まれる
    when: 自動チェックを行う
    then: NG表現の注意が出る
  - id: AC-003-07
    given: 承認待ちの投稿
    when: 承認者が修正指示「日付を強調して」を出す
    then: 投稿は下書きに戻り、修正指示を入力に再生成された下書き案が付く
  - id: AC-003-08
    given: 承認待ちの投稿
    when: 承認者が予約日時を指定して承認する
    then: 予約中になり、テンプレート利用の投稿なら画像生成ジョブが作られる
  - id: AC-003-09
    given: ボット対策のトークンが無い、または無効なPR入稿
    when: 送信する
    then: 受け付けず、何も保存されない
  - id: AC-003-10
    given: 有効なPR入稿
    when: 送信する
    then: 「受け付けました」と表示され、採否=受付で保存される。入稿者連絡先は編集者には表示されない
  - id: AC-003-11
    given: 受付のPR入稿
    when: 承認者が採用する
    then: 採否=採用になり、ネタ（出どころ=PR入稿）ができる。そこから作る投稿のPR区分はPR案件で、通常に変更できない
  - id: AC-003-12
    given: 同じIPから1時間に6件目のPR入稿
    when: 送信する
    then: 受け付けない（1時間5件まで。要確認）

non_functional:
  - id: NFR-003-01
    requirement: 承認待ち一覧から承認完了まで3タップ（一覧→投稿→承認）で完了する
    verify_by: test
  - id: NFR-003-02
    requirement: PR入稿フォームはCloudflare Turnstileで保護し、添付画像は1枚8MB・合計40MBまで
    verify_by: test

# 決定済み（2026-10-01 梶原）: 入稿者連絡先は採否決定から180日で削除、同一IPの受付は1時間5件まで（いずれも仮置きで進める）

out_of_scope:
  - 定型ネタの自動公開（精度が安定した後に別要件で扱う。PR・意見系は常に人が承認）
  - 入稿者への採否の自動連絡（運営が個別に連絡する）

open_questions:
  - 運営で最も時間がかかっている作業の確認（フェーズ2・3の優先順位の最終決定）
  - NG表現の初期リストと、個人名チェックの方法（辞書か、LLMか）
  - この要件の法務面（ステマ規制のPR表記の文言・位置）は AIの下書き。専門家の確認が必要
