# 出典: 「新島info Instagram自動投稿システム 要件定義書」（2026-10-01）5章 F-07〜F-11 / 9章 Gemini API
# 2026-10-04 梶原の依頼「投稿の質を担保したい。新島info の投稿（instagram.com/niijima_info_doshisha）のフォーマットに合わせ、
#   こちらが渡す情報から、画像の中の文字とキャプションの文章を AI が作るようにしてほしい」を反映して具体化した
# 2026-10-04 design-reviewer の要件レビュー（Critical 3・Major 13・Minor 5）と梶原の判断を反映
id: REQ-002
title: AIで下書き（画像・キャプション）を生成する（フェーズ2）
status: approved   # 2026-10-04 梶原が承認
background: |
  投稿1件ごとに画像を作り、キャプションを考える作業が運営の負担になっている。
  投稿は決まった型（表紙・中のスライド・最後のスライド・定型の締めを持つキャプション）で作られており、
  型どおりに作れているかで見た目の質が決まる。運営がネタ（箇条書きの情報）を渡すと、AI（Gemini 無料枠）が
  型に沿って画像の中の文言とキャプションを作り、テンプレートに流し込んで投稿画像にする。人は確認・直接の手直し・修正指示を行う。
  無料枠の上限や障害で止まらないよう、手動コピペの予備経路を持つ。

  新島info の投稿の型（2026-10-04 公開中の投稿から確認）:
    表紙           : 上端に紺の帯「同志社生向けSNSメディア」。暗くしたキャンパス写真の上に3段の文字。
                     1段目 白の対象（「同志社大学」「同志社大生」）、2段目 黄の大きなキーワード（上に小さな添え書き「＼ … ／」を付けることがある）、
                     3段目 色の帯（紫・赤・青緑）に白抜きの締めの言葉（「まとめたよ」「紹介します」など）
    中のスライド   : ぼかした写真の背景に白い見出し。その下の白い角丸のカードに、素材画像と説明文（強調したい語は赤字）
    最後のスライド : 「最後までご覧くださりありがとうございます」、過去の投稿2件の表紙、アカウントの紹介
    キャプション   : 本文2〜3段落（絵文字を含む）→ 区切り線 → 『同志社生向けSNSメディア』とアカウントの紹介（定型）→ ハッシュタグ
actors: [編集者, 承認者, 管理者, 定期処理, Gemini API, 画像生成の提供元]

# 用語（工程02で domain.yaml に登録・見直す）
#   ネタ           : 既存の用語。本文（1〜2,000文字）を箇条書きの情報として AI に渡す（「ネタのメモ」とは呼ばない。出どころの「運営メモ」と紛れるため）
#   スライド役割   : 表紙 / 中のスライド / 最後のスライド（既存の name_ja「本文」「まとめ」は avoid に回す。キャプション本文・締めの言葉「まとめたよ」と紛れるため）
#   表紙の文言     : 対象・キーワード・添え書き・締めの言葉
#   スライドの文言 : 中のスライドの見出し・説明文・強調する語
#   絵の指示       : 中のスライドの素材画像を画像生成するための指示（AI が下書き案に含めて返す。固有名詞・商標を含めない）
#   素材画像       : 中のスライドのカードに載せる画像。生成画像（REQ-005）か、人が差し替えた画像
#   背景写真       : 表紙の背景に使う、団体が登録したキャンパスの写真（説明文つき）
#   アクセント色   : 表紙の3段目の帯の色（区分: 紫・赤・青緑）
#   キャプションの定型 : 区切り線・『同志社生向けSNSメディア』・アカウントの紹介など、毎回同じ締めの文
#   固定ハッシュタグ   : 毎回付けるハッシュタグ
#   投稿の型の設定     : 上の固定の文言・候補を団体ごとに持つ設定値

concerns:
  - 新島info の投稿の型（表紙・中のスライド・最後のスライド・キャプションの定型）から外れた投稿が出ないこと
  - 画像の中の文字が崩れず（文字化け・はみ出しが無く）、毎回同じ見た目で読めること
  - 運営はネタを渡すだけでよく、文言を考える手間がかからないこと。誤字はその場で直せ、大きな直しは自然文で頼めること
  - AI が事実（日時・場所・料金・URL）を勝手に作らないこと。ネタに無い事実が出たら人が気づけること
  - 画像生成・LLM の無料枠を使い切らず、上限に達しても作業が止まらないこと
  - AI が作った画像を実際の写真と誤解させないこと（REQ-005 の開示に従う）
  - どのプロンプトでどんな出力が出て、どう直されたかが後から分かること
  - 個人情報をLLMに送らないこと

business_rules:
  # ── 型とテンプレート ──
  - id: BR-002-01
    rule: |
      画像の中の文字は AI が文言だけを作り、テンプレート（HTML/CSS）に流し込んで描く。AI の画像生成に文字を描かせない
      （日本語の文字が崩れるため。2026-10-04 梶原）。差し込む文言はHTMLエスケープする。出力は1080×1350（4:5）のJPEG
    terms: [テンプレート, スライド, スライド役割, 画像仕様]
  - id: BR-002-02
    rule: |
      画面ではテンプレートをHTMLのままプレビューする。公開用の画像化は、承認した版の内容と、承認時点のテンプレートの版で、
      承認後に定期処理が行う（予約日時より前に済ませる）。画像化に失敗したら投稿は失敗（失敗区分「画像化の失敗」）になり、
      REQ-001 の「今すぐ再実行」でやり直せる
    terms: [テンプレート, 投稿画像, ジョブ, 投稿状態, 失敗理由]
  - id: BR-002-11
    rule: |
      投稿はスライドで構成する: 表紙1枚 → 中のスライド1〜8枚 → 最後のスライド1枚（合計3〜10枚。Instagram のカルーセル上限10枚）。
      中のスライドの枚数は、ネタの内容に合わせて AI が1〜8枚で決める（人が足し引きできる）。役割の並びは変えられない
    terms: [スライド, スライド役割, テンプレート]
  - id: BR-002-17
    rule: |
      投稿の型の固定の文言・候補は団体の設定値で、コード変更なしに変えられる。AI はこれらを書き換えない。新島info の初期値:
      上端の帯の文言「同志社生向けSNSメディア」／表紙の対象の候補「同志社大学」「同志社大生」／
      最後のスライドの定型文「最後までご覧くださりありがとうございます」とアカウントの紹介／
      キャプションの定型（区切り線・『同志社生向けSNSメディア』・アカウントの紹介。正式な文面は新島info から受け取るまで公開中の投稿の文を仮置き）／
      固定ハッシュタグ「#同志社大学」「#同志社」
    terms: [投稿の型の設定, キャプションの定型, 固定ハッシュタグ, 団体]
  # ── 文言 ──
  - id: BR-002-12
    rule: |
      表紙の文言は4つ: 対象（投稿の型の設定の候補のどれか）・キーワード（1〜12文字。長いときは文字を縮めて1行に収める。2026-10-08 梶原、実例「本選考向け EVENT」11文字から）・添え書き（0〜16文字。無くてよい。全角「｜」で左右2つに分けられる）・
      締めの言葉（1〜8文字）。帯の色はアクセント色（紫・赤・青緑の3つだけ）から AI が選ぶ
    terms: [表紙の文言, アクセント色, スライド]
  - id: BR-002-13
    rule: |
      中のスライドの文言は、見出し（1〜16文字）と説明文（1〜120文字）と強調する語（0〜3か所）。
      強調する語は説明文に含まれる部分文字列で、互いに重ならない。赤字で描く
    terms: [スライドの文言, スライド]
  - id: BR-002-18
    rule: |
      スライドの文言の文字数はコードポイントで数える（キャプションと同じ。絵文字は1文字）。
      人は下書き案の文言（表紙・中のスライド・キャプション本文・追加のハッシュタグ）を直接書き換えられる。
      人の入力にも AI の出力と同じ文字数・形式の条件をかけ、満たさなければ保存できない。直接の書き換えは LLM利用回数を使わない
    terms: [下書き案, 表紙の文言, スライドの文言, キャプション]
  # ── 生成 ──
  - id: BR-002-10
    rule: |
      入力はネタ。出どころ（運営メモ・大学ニュース・PR入稿）によらず、本文を箇条書きの情報として扱う（本文の検査はネタの登録時に行う）。
      AI にはネタに書かれた事実（日時・場所・料金・URL・固有名詞）だけを使うよう指示する。
      生成後、システムが出力（スライドの文言・キャプション本文）から日付・時刻・金額・URL を抜き出し、ネタの本文に無いものがあれば
      「ネタに無い情報」として該当箇所を画面で注意する（自動では消さない。人が直すか承知する）
    terms: [ネタ, 下書き案, スライド]
  - id: BR-002-03
    rule: |
      AIの出力はJSONスキーマで固定する（表紙の文言・アクセント色・背景写真（候補から選んだID。BR-002-14）・中のスライドごとの文言と絵の指示と差し替えが必要かの印・
      キャプション本文・追加のハッシュタグ・PR区分・参照元URL）。スキーマ・文字数・形式の条件（BR-002-12, 13, 16）に合わない出力は、
      違反内容を添えて1回だけ再生成し、だめならエラーにする
    terms: [下書き案, プロンプト用途, スライド, キャプション]
  - id: BR-002-04
    rule: |
      修正指示は1〜500文字の自然文。直前の下書き案と修正指示を入力に、文言だけを作り直す。
      人が差し替えた素材画像・選び直した背景写真・作成済みの素材画像は保つ（画像の作り直しは別の操作）
    terms: [修正指示, 下書き案, 生成, 素材画像, 背景写真]
  - id: BR-002-05
    rule: |
      LLMを呼ぶ前にLLM利用回数を1回分確保する。違反による1回だけの再生成（BR-002-03）も、もう1回分確保する。
      確保できなければ（上限に達していたら）呼ばずに手動コピペを案内する。上限の8割で警告を出す
    terms: [LLM利用回数, LLM上限, 警告, 生成経路]
  - id: BR-002-06
    rule: 手動コピペでは、プロンプト（入力込み）を画面に表示し、外部AIの結果JSONを貼り戻すとAPIと同じ検証を通して下書き案にする。LLM利用回数は数えない
    terms: [生成経路, 下書き案, 生成]
  - id: BR-002-07
    rule: プロンプト本文は版で管理し、変更は新しい版を作る。用途ごとに有効な版は1つ。生成には使った版を記録する
    terms: [プロンプト版, プロンプト用途, 生成]
  - id: BR-002-08
    rule: |
      生成の入力・出力・プロンプト版・生成経路を生成として記録する。その後の修正指示・承認結果は、生成を書き換えず
      別の出来事として追記し、生成と結び付ける。入稿者連絡先は入力に含めない
    terms: [生成, 入稿者連絡先, 修正指示]
  - id: BR-002-09
    rule: LLMの提供元とモデル名は団体の設定値で、コード変更なしに差し替えられる
    terms: [団体, LLM上限]
  # ── 画像 ──
  - id: BR-002-22
    rule: |
      中のスライドの素材画像は、人がスライドごとに「絵を作る」を押したときだけ、AI が用意した絵の指示（人が直せる）で画像生成する
      （下書き案の生成時には作らない。画像生成は1日20回までのため。2026-10-04 梶原）。画像生成の検査・英訳・回数・失敗は REQ-005 に従い、
      画像の種類は背景・イラストと写真風のどちらも選べる。作れなかったとき（上限・英訳できない・失敗・指示の検査で拒否）は、
      そのスライドは素材画像の無いカード（文字だけ）のままで、下書き案は失われない
    terms: [絵の指示, 素材画像, 画像生成, 画像の種類, スライド]
  - id: BR-002-19
    rule: |
      絵の指示には固有名詞・商標・実在の人物を入れない（REQ-005 BR-005-09）。実在のロゴ・料金表・アプリの画面などが要るスライドには、
      AI が「差し替えが必要」の印を付けて返し、画面で示す。人はどのスライドでも素材画像を自分の画像に差し替えられる
    terms: [絵の指示, 素材画像, スライド]
  - id: BR-002-20
    rule: |
      素材画像として候補を使うことは「素材画像としての採用」で、REQ-005 の候補の採用と同じ条件（採用できる候補）で受け付ける。
      採用は投稿の版を保存した時点に、そのスライドに結び付けて記録する。
      素材画像として使った生成画像も「投稿に含まれる生成画像」として扱い、写真風を含めば REQ-005 の AI生成の表示（キャプション末尾・AI info）と
      承認時の確認が付く。人が差し替えた画像は生成画像ではない
    terms: [素材画像, 素材画像としての採用, 採用できる候補, 生成画像, AI生成の表示, 画像の種類]
  - id: BR-002-14
    rule: |
      表紙の背景は、団体が登録した背景写真から、写真の説明文をもとに AI が話題に合うものを選ぶ。人が選び直せる。
      背景写真が1枚も無ければ、紺の単色の背景にする
    terms: [背景写真, スライド]
  - id: BR-002-21
    rule: |
      背景写真は管理者が登録する（JPEG/PNG、画像仕様に変換、説明文1〜100文字、団体ごとに最大30枚）。
      使っている投稿がある背景写真は消さずに「使わない」にする（以後の候補から外れるが、既存の投稿の画像化には使える）
    terms: [背景写真, ロール, 画像仕様]
  - id: BR-002-15
    rule: |
      最後のスライドは自動で作る: 投稿の型の設定の定型文、承認した時点で公開済みの投稿（その投稿自身を除く）のうち公開日時が新しい2件の表紙
      （その投稿の投稿画像の1枚目）、アカウントの紹介。選んだ2件は承認した版に記録し、画像化はそれを使う。
      公開済みの投稿が2件に満たなければ、ある分だけ載せる（0件なら過去の投稿の欄を出さない）
    terms: [スライド, 投稿, 公開結果, 投稿画像]
  # ── キャプション ──
  - id: BR-002-16
    rule: |
      公開用キャプションは次の順に1か所で組み立てる: PR表記（PR案件のみ）→ AI が書く本文（2〜3段落、絵文字可）→ AI生成の表示（写真風の生成画像を含むときのみ）→
      キャプションの定型 → ハッシュタグ（固定ハッシュタグ ＋ AI が話題に合わせて足す0〜5個。重複は除く）。
      本文の上限は「2,200 −（PR表記・AI生成の表示・定型・ハッシュタグの文字数）」で、生成時の検証（BR-002-03）と人の書き換え（BR-002-18）の両方にかける。
      生成の時点では素材画像がまだ無く写真風を含むか分からないため、AI生成の表示の18文字を常に見込む（承認依頼の時点では実際の内容で検査する）。
      組み立てた結果は2,200文字以下・ハッシュタグ30個以下
    terms: [キャプション, キャプションの定型, 固定ハッシュタグ, ハッシュタグ, PR区分, AI生成の表示]

acceptance_criteria:
  - id: AC-002-01
    given: 見出しに「<script>alert(1)</script>」を含むスライド
    when: テンプレートでプレビュー・画像化する
    then: 文字列としてそのまま表示され、スクリプトは実行されない
  - id: AC-002-02
    given: 承認された、テンプレートを使う投稿（表紙1・中のスライド2・最後のスライド1）
    when: 定期処理が走る
    then: 1080×1350のJPEGが4枚、承認した版の内容で生成され、公開用ストレージに保存されて投稿画像一覧になる
  - id: AC-002-03
    given: スキーマどおりの出力（表紙・中のスライド3枚・キャプション本文・追加のハッシュタグ2個）を返す Gemini の代役
    when: 下書き案を生成する
    then: 表紙 → 中のスライド3枚 → 最後のスライド の順に並んだプレビューと、組み立てたキャプションが表示される
  - id: AC-002-04
    given: Geminiがスキーマに合わない出力を2回続けて返す
    when: 生成する
    then: 「生成に失敗しました。手動コピペで続けられます」と表示され、生成は失敗として記録され、LLM利用回数は2回増える
  - id: AC-002-05
    given: 中のスライド2枚目の素材画像を人が差し替え、背景写真を選び直した下書き案に「もっとくだけた感じで」と修正指示を出す
    when: 再生成する
    then: 文言だけが新しくなり、差し替えた素材画像と選び直した背景写真はそのまま。生成として修正指示と元の生成IDが記録される
  - id: AC-002-06
    given: LLM上限が1日100回・警告の割合0.8で、今日すでに 79回 / 80回 / 99回 / 100回 使っている
    when: 生成する
    then: 79回なら警告なしで生成、80回・99回なら生成して「生成上限が近い」警告（100回目は通る）、100回ならAPIを呼ばず手動コピペを案内する
  - id: AC-002-07
    given: 手動コピペで、不正なJSONを貼り付けた
    when: 取り込む
    then: どこが不正かを表示し、下書き案にしない。LLM利用回数は増えない
  - id: AC-002-08
    given: キャプション用プロンプトの版3が有効
    when: 管理者が本文を変えて保存する
    then: 版4が作られて有効になり、版3は無効として残る。以後の生成は版4を記録する
  - id: AC-002-09
    given: PR入稿から作ったネタ
    when: 生成する
    then: Geminiへのリクエスト本文に入稿者連絡先（メールアドレス・担当者名）が含まれない
  - id: AC-002-10
    given: 団体設定のモデル名を別のFlash系モデルに変えた
    when: 生成する
    then: コード変更なしに新しいモデル名で呼ばれ、LLM利用回数はモデルごとに数えられる
  - id: AC-002-11
    given: 表紙のキーワードが 12文字 / 13文字、締めの言葉が 8文字 / 9文字、対象が「同志社」、アクセント色が「緑」の AI の出力
    when: 下書き案にする
    then: 12文字・8文字は受け付け、13文字・9文字・対象「同志社」・色「緑」は違反として1回だけ再生成させる
  - id: AC-002-12
    given: 中のスライドの説明文が 120文字 / 121文字、強調する語が 3か所 / 4か所 / 説明文に無い語 / 重なる2か所 の AI の出力
    when: 下書き案にする
    then: 120文字・3か所は受け付けて強調する語を赤字で描く。121文字・4か所・説明文に無い語・重なる指定は違反として1回だけ再生成させる
  - id: AC-002-13
    given: ネタの本文に日付が書かれていないのに、出力の説明文に「11/3」が含まれる
    when: 下書き案を生成する
    then: その説明文の「11/3」に「ネタに無い情報」の注意が出る。ネタにある日付・金額・URL には注意が出ない
  - id: AC-002-14
    given: 中のスライド2枚目の素材画像を、人が料金表のスクリーンショットに差し替えた（ほかのスライドは背景・イラストの生成画像）
    when: 承認を依頼し、公開する
    then: カードに差し替えた画像が載る。差し替えた画像は生成画像ではなく、背景・イラストの生成画像だけなので AI生成の表示も is_ai_generated も付かない
  - id: AC-002-15
    given: 承認した時点で、その投稿以外の公開済みの投稿が 0件 / 1件 / 5件
    when: 承認し、その後さらに別の投稿が公開されてから画像化する
    then: 0件なら過去の投稿の欄が無い、1件なら1件、5件なら承認時点で公開日時が新しい2件が載る（承認後に公開された投稿には変わらない）
  - id: AC-002-16
    given: 背景写真が 0枚 / 3枚 登録されている
    when: 下書き案を生成する
    then: 0枚なら表紙は紺の単色の背景、3枚ならそのうち1枚が選ばれ、人が別の1枚に選び直せる
  - id: AC-002-17
    given: AI が書いた本文と、追加のハッシュタグ「#学割」「#同志社」「#京都」
    when: キャプションを組み立てる
    then: 本文 → 定型 → #同志社大学 #同志社 #学割 #京都 の順になる（重複の #同志社 は1つ）。定型の文は AI の出力で変わらない
  - id: AC-002-18
    given: PR案件で、写真風の素材画像を含み、組み立てると 2,200文字 / 2,201文字 になる下書き案
    when: 承認を依頼する
    then: 2,200文字は受け付け、2,201文字は「PR表記とAI生成の表示を含めて2,200文字以内にしてください」で拒否される（定型・ハッシュタグも数える）
  - id: AC-002-19
    given: 写真風で作った素材画像を中のスライドに使った下書き案
    when: 保存し、承認待ちにして承認者が開き、公開する
    then: 候補の採用がそのスライドに結び付けて記録され、承認時に「写真風の生成画像を含みます」の確認が出て、キャプション末尾にAI生成の表示、公開時に is_ai_generated が付く
  - id: AC-002-20
    given: 画像生成の上限に達している / 絵の指示が個人情報を含む
    when: 中のスライドで「絵を作る」を押す
    then: REQ-005 と同じ文言が出て画像生成されず、そのスライドは文字だけのカードのまま。下書き案の文言は失われない
  - id: AC-002-21
    given: 「Spotify の料金表」が要る中のスライド
    when: 下書き案を生成する
    then: 絵の指示に「Spotify」は含まれず、そのスライドに「差し替えが必要」の印が出る
  - id: AC-002-22
    given: 人が表紙のキーワードを 13文字 に書き換えた / キャプション本文を上限を1文字超える長さに書き換えた
    when: 保存する
    then: どちらも保存できず、違反の理由が出る。LLM利用回数は増えない
  - id: AC-002-23
    given: 承認済みの投稿で、使っている背景写真が見つからない（ストレージの不整合）
    when: 定期処理が画像化する
    then: 投稿は失敗（画像化の失敗）になり、理由が表示される。「今すぐ再実行」でやり直せる
  - id: AC-002-24
    given: 承認済みの投稿が使っている背景写真
    when: 管理者がその写真を消そうとする
    then: 消えずに「使わない」になり、以後の候補から外れる。その投稿の画像化には使える

non_functional:
  - id: NFR-002-01
    requirement: 修正指示による再生成は、定期処理を待たずに画面の操作から（API関数経由で）Geminiを呼び、通常30秒以内に結果が出る（タイムアウト60秒）
    verify_by: monitoring
  - id: NFR-002-02
    requirement: GeminiのAPIキーはブラウザに渡さない（サーバー側の関数からのみ呼ぶ）
    verify_by: test
  - id: NFR-002-03
    requirement: LLM利用回数の確保は同時に呼ばれても上限を超えない（原子的に加算）
    verify_by: test
  - id: NFR-002-04
    requirement: 同じ下書き案・同じテンプレートの版からは、画面のプレビューと定期処理の画像化で同じ見た目になる（文字の位置・折り返し・色）
    verify_by: test
  - id: NFR-002-05
    requirement: 各欄の上限文字数を最も幅の広い文字（全角の漢字・絵文字）で埋めても、テンプレートの枠からはみ出さず、文字化けしない
    verify_by: test

out_of_scope:
  - 写真・イラストそのものの生成のしくみ（REQ-005 で扱う。REQ-002 はそれを素材画像に使うだけ）
  - 動画（リール）の生成
  - テンプレートのデザインを画面から編集すること（デザインの変更はコードとテンプレートの版で行う）

open_questions: []

# 決定済みの前提（2026-10-04 梶原）
assumptions:
  - Gemini 無料枠の利用は、京愛が新島info から料金を取っていないため商用利用の問題は無いものとして進める（ADR-0004 の前提）
  - テンプレートの素材（ロゴ・色・文字の見た目）は、新島info の公開中の投稿から読み取って再現する（素材の提供は待たない）。
    色の値とロゴは投稿の画像から取り、設計書に記録する
  - フォントは、公開中の投稿の見た目に近く、商用利用・埋め込み・サーバーでの画像化が許される OFL などのフリーフォントを選ぶ（新島info の元のフォントは使わない）
  - キャンパスの写真・大学名を表紙や背景に使ってよい（新島info の許諾の範囲内）
