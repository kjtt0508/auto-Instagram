# 出典: 「新島info Instagram自動投稿システム 要件定義書」（2026-10-01）5章 F-07〜F-11 / 9章 Gemini API
id: REQ-002
title: AIで下書き（画像・キャプション）を生成する（フェーズ2）
status: draft
background: |
  投稿1件ごとに画像を作り、キャプションを考える作業が運営の負担になっている。
  新島infoのトンマナをテンプレートにし、AI（Gemini無料枠）が文言を作って画像に流し込み、
  人は確認と修正指示だけを行う形にする。無料枠の上限や障害で止まらないよう、手動コピペの予備経路を持つ。
actors: [編集者, 承認者, 管理者, 定期処理, Gemini API]

concerns:
  - 新島infoらしい見た目（トンマナ）の画像が、毎回同じ品質で作られること
  - 修正指示を自然文で出せば、待たされずに作り直されること
  - 無料枠の上限を超えて課金や停止が起きないこと。上限に達しても作業が止まらないこと
  - どのプロンプトでどんな出力が出て、どう直されたかが後から分かること
  - 個人情報をLLMに送らないこと

business_rules:
  - id: BR-002-01
    rule: テンプレートはHTML/CSSで、スライドの見出し・本文だけを差し込む。差し込む文言はHTMLエスケープする。出力は1080×1350（4:5）のJPEG
    terms: [テンプレート, スライド, スライド役割, 画像仕様]
  - id: BR-002-02
    rule: 画面ではテンプレートをHTMLのままプレビューし、公開用の画像化は承認後に定期処理が行う
    terms: [テンプレート, 投稿画像, ジョブ]
  - id: BR-002-03
    rule: AIの出力はJSONスキーマで固定する（スライド構成・キャプション・ハッシュタグ・PR区分・参照元URL）。スキーマに合わない出力は1回だけ再生成し、だめならエラーにする
    terms: [下書き案, プロンプト用途, スライド, キャプション]
  - id: BR-002-04
    rule: 修正指示は1〜500文字の自然文。直前の下書き案と修正指示を入力に再生成する
    terms: [修正指示, 下書き案, 生成]
  - id: BR-002-05
    rule: LLMを呼ぶ前にLLM利用回数を1回分確保する。上限に達していたら呼ばずに手動コピペを案内する。上限の8割で警告を出す
    terms: [LLM利用回数, LLM上限, 警告, 生成経路]
  - id: BR-002-06
    rule: 手動コピペでは、プロンプト（入力込み）を画面に表示し、外部AIの結果JSONを貼り戻すとAPIと同じ検証を通して下書き案にする。LLM利用回数は数えない
    terms: [生成経路, 下書き案, 生成]
  - id: BR-002-07
    rule: プロンプト本文は版で管理し、変更は新しい版を作る。用途ごとに有効な版は1つ。生成には使った版を記録する
    terms: [プロンプト版, プロンプト用途, 生成]
  - id: BR-002-08
    rule: 生成の入力・出力・プロンプト版・生成経路・その後の承認結果と修正指示を生成として記録する。入稿者連絡先は入力に含めない
    terms: [生成, 入稿者連絡先]
  - id: BR-002-09
    rule: LLMの提供元とモデル名は団体の設定値で、コード変更なしに差し替えられる
    terms: [団体, LLM上限]

acceptance_criteria:
  - id: AC-002-01
    given: 見出しに「<script>alert(1)</script>」を含むスライド
    when: テンプレートでプレビュー・画像化する
    then: 文字列としてそのまま表示され、スクリプトは実行されない
  - id: AC-002-02
    given: 承認された、テンプレートを使う投稿（スライド3枚）
    when: 定期処理が走る
    then: 1080×1350のJPEGが3枚生成され、公開用ストレージに保存されて投稿画像一覧になる
  - id: AC-002-03
    given: ネタ本文「11/3 学園祭で○○サークルが出店」
    when: キャプション生成を実行する
    then: スキーマどおりのJSON（slides 1〜10、caption 2,200字以下、hashtags 30個以下、prCategory、sourceUrls）が返り、下書き案として画面に出る
  - id: AC-002-04
    given: Geminiがスキーマに合わない出力を2回続けて返す
    when: 生成する
    then: 「生成に失敗しました。手動コピペで続けられます」と表示され、生成は失敗として記録される
  - id: AC-002-05
    given: 下書き案に「もっとくだけた感じで」と修正指示を出す
    when: 再生成する
    then: 新しい下書き案が表示され、生成として修正指示と元の生成IDが記録される
  - id: AC-002-06
    given: LLM上限が1日100回で、今日すでに79回 / 80回 / 100回使っている
    when: 生成する
    then: 79回目までは警告なし、80回到達で「生成上限が近い」警告、100回到達後はAPIを呼ばず手動コピペを案内する
  - id: AC-002-07
    given: 手動コピペで、不正なJSONを貼り付けた
    when: 取り込む
    then: どこが不正かを表示し、下書き案にしない。LLM利用回数は増えない
  - id: AC-002-08
    given: キャプション用プロンプトの版3が有効
    when: 管理者が本文を変えて保存する
    then: 版4が作られて有効になり、版3は無効として残る。以後の生成は版4を記録する
  - id: AC-002-09
    given: PR入稿から作ったネタ
    when: 生成する
    then: Geminiへのリクエスト本文に入稿者連絡先（メールアドレス・担当者名）が含まれない
  - id: AC-002-10
    given: 団体設定のモデル名を別のFlash系モデルに変えた
    when: 生成する
    then: コード変更なしに新しいモデル名で呼ばれ、LLM利用回数はモデルごとに数えられる

non_functional:
  - id: NFR-002-01
    requirement: 修正指示による再生成は、定期処理を待たずに画面の操作から（API関数経由で）Geminiを呼び、通常30秒以内に結果が出る（タイムアウト60秒）
    verify_by: monitoring
  - id: NFR-002-02
    requirement: GeminiのAPIキーはブラウザに渡さない（サーバー側の関数からのみ呼ぶ）
    verify_by: test
  - id: NFR-002-03
    requirement: LLM利用回数の確保は同時に呼ばれても上限を超えない（原子的に加算）
    verify_by: test

out_of_scope:
  - 画像そのものをAIで生成すること（写真・イラスト生成）。画像はテンプレートと運営が撮影した素材のみ
  - 動画（リール）の生成

open_questions:
  - Gemini無料枠の商用利用条件（京愛による無償提供が商用利用に当たるか）の確認。抵触する場合は有料プランに切り替える（ADR-0004）
  - 無料枠の実際の上限値（AI Studioで確認）と、自前で設定するLLM上限の値
  - 新島infoの過去投稿（画像・キャプション・Insights）5〜10件の提供（テンプレートとプロンプトの元になる）
  - スライドの見出し・本文の文字数上限（テンプレートのデザインで決まる）
