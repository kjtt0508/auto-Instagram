# 出典: 梶原の依頼（2026-11-03）「投稿の最後のページの真ん中に画像を2つ並べて配置するようにデザインの修正と、張り付ける画像を選択できるようにしてほしい。
#        張り付ける画像の選択は設定画面において」「自動はやめて設定画面で画像をアップロードする形にして」
# 位置づけ: REQ-002（AIで下書き）の改修。承認済みの REQ-002 は中身を変えず（置き換えの印だけ付ける。2026-11-03 梶原了承）、この要件が次の点を置き換える
#   - REQ-002 BR-002-15（最後のスライドに、承認した時点で公開日時が新しい2件の過去の投稿の表紙を自動で載せる）
#     → 投稿の型の設定でアップロードした「最後のスライドの画像」（0〜2枚）を載せる。承認のときの自動の選択はやめる
#   - REQ-002 AC-002-15（承認時点の公開済みの投稿 0件 / 1件 / 5件 で載る表紙が決まる）→ AC-007-05・AC-007-08 に置き換える
#   - REQ-002 BR-002-17（投稿の型の設定の項目）→ 最後のスライドの画像を足す
# レビュー: 2026-11-03 design-reviewer の指摘（版の決まり方・移行期・画像を消さない・直接の要求・小さい画像・選び直し）を反映
id: REQ-007
title: 最後のスライドの画像を設定画面でアップロードする（改修）
status: approved   # 2026-11-03 梶原が承認
background: |
  最後のスライドの真ん中には、承認した時点で公開済みの投稿のうち新しい2件の表紙を自動で載せている（REQ-002 BR-002-15）。
  このアプリから公開した投稿しか対象にならないため、使い始めのうちは画像の欄が出ないか1枚だけになり、載せたい画像も選べない。
  そこで自動の選択をやめ、管理者が投稿の型の設定の画面（S-15）で画像を2枚までアップロードし、それを最後のスライドの真ん中に横に並べて載せる。
  決まっていること（2026-11-03 梶原）:
    ・自動で選ぶのはやめ、設定画面でアップロードした画像だけを載せる。用語は「最後のスライドの画像」
    ・2枚に満たないときは、ある分だけ載せる（1枚なら真ん中に1枚、0枚なら画像の欄を出さない）
    ・画像の縦横比が枠と違うときは、中央を残して切り抜く
    ・配置はいまのまま（真ん中に縦長の枠を2つ、横に並べる）
    ・切り抜いたあとが枠（400×500px）より小さい画像は受け付けない
    ・改修前に保存した下書き・承認依頼中の投稿は、リリースの手順（先に画像を設定し、保存し直す）で対応する
actors: [管理者, 編集者, 承認者, 定期処理]

concerns:
  - 最後のスライドに、載せたい画像を毎回同じように載せられること（公開済みの投稿の数に左右されない）
  - 画像を変えても、承認を依頼した投稿・承認した投稿・公開した投稿の見た目が変わらないこと
  - 画面のプレビュー・承認の画面・公開用の画像で、最後のスライドの見た目が同じになること
  - 公開用の画像で、最後のスライドの画像がぼやけたり、ゆがんだりしないこと
  - 団体の画像を公開リポジトリに置かないこと・他団体から見えないこと（ロゴと同じ扱い）

business_rules:
  - id: BR-007-01
    rule: |
      最後のスライドの画像は投稿の型の設定の項目で、0〜2枚。並びの順（1枚目・2枚目）を持つ。管理者だけが設定の画面で、1枚ずつ
      アップロード（空いている次の順に入る）・選び直し（その順のまま差し替える）・外すができ、保存すると投稿の型の設定の新しい版になる（ロゴと同じ。BR-002-17）。
      1枚目を外すと2枚目が1枚目になる（間を空けない）。2枚の左右の入れ替えはしない（選び直しで行う）
    terms: [投稿の型の設定, 最後のスライドの画像, ロール]
  - id: BR-007-02
    rule: |
      アップロードできるのは PNG と JPEG。画面で、縦横比 4:5 の中央を切り抜き（横長なら左右、縦長なら上下を同じ幅ずつ切る）、800×1000px より大きければ 800×1000px に縮小して、
      JPEG で保存する（ゆがめない・余白を足さない）。切り抜いたあとが 400×500px より小さい画像は受け付けず、「縦500px・横400px 以上の画像を選んでください」と表示する。
      PNG・JPEG 以外は「PNG か JPEG を選んでください」と表示する。どちらも設定は変わらない
    terms: [最後のスライドの画像, 画像仕様]
  - id: BR-007-03
    rule: |
      最後のスライドは、定型文 → 区切り → 最後のスライドの画像 → アカウントの紹介 の順に描く（いまの配置のまま）。画像は真ん中に縦長の枠（400×500px、間隔 40px）で横に並べ、
      1枚目を左、2枚目を右に置く。1枚なら真ん中に1枚、0枚なら画像の欄を出さない（ほかの部分の位置は変えない）
    terms: [最後のスライドの中身, 最後のスライドの画像, スライド, テンプレート]
  - id: BR-007-04
    rule: |
      承認のときに過去の投稿の表紙を選ぶことはやめる（REQ-002 BR-002-15 を置き換える）。最後のスライドに載せる画像は、その投稿の版が使った投稿の型の設定の版の
      最後のスライドの画像で決まる。投稿の版が使う設定の版は、下書きを保存した時点の最新の版（いまの決まりのまま）。
      このため、承認を依頼した後・承認した後に設定の画像を変えても、その投稿の承認の画面・投稿の表示・画像化は保存した時点の画像のまま。
      下書きに戻して（修正指示・下書きに戻す）保存し直すと、その時点の最新の版の画像になる。
      編集の画面のプレビューは、保存すると使う版（最新の版）の画像を出す。承認の画面・投稿の表示は、投稿の版が記録した版の画像を出す
    terms: [最後のスライドの画像, 投稿の型の設定, 投稿の版, 投稿履歴]
  - id: BR-007-05
    rule: |
      この改修より前に承認した投稿は、承認したときの記録のまま画像化する（まだ画像化していない投稿・「今すぐ再実行」でやり直す投稿を含む）。
      過去の投稿の表紙を記録していればその表紙を、記録が0件なら画像の欄なしで描く（設定の画像には変えない）。公開済みの投稿の画像は作り直さない。
      改修前に承認した投稿が下書きに戻り、改修後に保存し直して承認されたときは、新しい承認なので BR-007-04 に従う（過去の投稿の表紙は載らない）。
      改修前に保存した下書き・承認依頼中の投稿は、古い設定の版（最後のスライドの画像が無い）を使うので、保存し直すまで画像は0枚になる。
      リリースの手順で、先に管理者が画像を設定し、進行中の下書きを保存し直す（承認依頼中は下書きに戻して保存し直す）ことを案内する
    terms: [過去の投稿の表紙, 投稿履歴, 投稿画像, 投稿の版]
  - id: BR-007-06
    rule: |
      最後のスライドの画像は、外しても選び直しても Storage から消さない（古い版の設定と、それを使った投稿が使い続けるため。追記だけ）。
      画像化のときに画像が Storage に見つからなければ、画像化は失敗（失敗区分「画像化の失敗」。BR-002-02）になり、
      理由「最後のスライドの画像が見つかりません。管理者が画像を設定し直したあと、下書きに戻して保存し直してください」を表示する。
      この失敗は「今すぐ再実行」では直らないので、画像化の失敗の決まった案内（「今すぐ再実行でやり直せます」）は付けず、理由だけを表示する（2026-11-03 梶原了承）
    terms: [最後のスライドの画像, ジョブ, 失敗理由, 失敗区分]
  - id: BR-007-07
    rule: |
      サーバーは、画面を通さない直接の要求でも、管理者でない・他団体の保存先・3枚以上・同じ順が重なる・保存先の形式（自分の団体の設定の場所の .jpg）が違う
      最後のスライドの画像の保存を拒否する（設定の新しい版も作らない）
    terms: [最後のスライドの画像, 投稿の型の設定, ロール, 団体]

acceptance_criteria:
  - id: AC-007-01
    given: 管理者が投稿の型の設定の画面を開いている（最後のスライドの画像は 0枚）
    when: 縦横 2000×1000px の JPEG と 900×1200px の PNG を順にアップロードして保存する
    then: 投稿の型の設定の新しい版ができ、最後のスライドの画像が2枚（1枚目は中央の 800×1000px を切り抜いた 800×1000px の JPEG、2枚目は中央の 900×1125px を切り抜いて縮小した 800×1000px の JPEG）になる。2枚あるときは3枚目をアップロードできない
  - id: AC-007-02
    given: 縦横 400×500px / 399×500px / 400×499px / 1000×300px（切り抜くと 240×300px）の画像
    when: 最後のスライドの画像としてアップロードする
    then: 400×500px は 400×500px のまま受け付ける。ほかの3つは「縦500px・横400px 以上の画像を選んでください」と表示し、設定は変わらない
  - id: AC-007-03
    given: GIF と PDF のファイル
    when: 最後のスライドの画像としてアップロードしようとする
    then: 「PNG か JPEG を選んでください」と表示し、設定は変わらない
  - id: AC-007-04
    given: 最後のスライドの画像が2枚（A・B）の設定
    when: 1枚目を外して保存する / 1枚目を画像C に選び直して保存する / 2枚とも外して保存する
    then: それぞれ新しい版の画像が [B] / [C, B] / 0枚 になる。前の版は [A, B] のまま変わらず、A・B の画像は Storage に残る
  - id: AC-007-05
    given: 最後のスライドの画像が 0枚 / 1枚 / 2枚 の設定で保存した下書き
    when: 編集の画面でプレビューし、承認を依頼して承認の画面で見て、承認して画像化する
    then: 0枚なら画像の欄が無く、1枚なら真ん中に1枚、2枚なら1枚目が左・2枚目が右に並ぶ（どれも 400×500px の枠いっぱい）。定型文・区切り・アカウントの紹介の位置は3つとも同じ。プレビュー・承認の画面・公開用の画像で同じ見た目になる
  - id: AC-007-06
    given: 画像A の設定（版1）で保存して承認を依頼した投稿と、承認した投稿
    when: 管理者が画像B に変えて保存し（版2）、その後に承認の画面で見る・承認して画像化する
    then: どちらも画像A のまま。承認を依頼した投稿を修正指示で下書きに戻して保存し直すと画像B になる。版2 の後に新しく保存した下書きも画像B
  - id: AC-007-07
    given: 版1（画像A）の時点で保存した下書きがあり、その後に設定を版2（画像B）に変えた
    when: その下書きを編集の画面で開いてプレビューする
    then: プレビューは画像B（保存すると使う最新の版）。保存すると、その下書きの版は版2 を使う
  - id: AC-007-08
    given: 公開済みの投稿が5件ある団体で、最後のスライドの画像が 0枚 の設定で保存した投稿
    when: 承認して画像化する
    then: 最後のスライドに過去の投稿の表紙は載らない（自動では選ばない）。承認の記録に過去の投稿は残らない
  - id: AC-007-09
    given: この改修より前に承認した、まだ画像化していない投稿（過去の投稿の表紙を 2件 記録したもの / 0件 のもの）
    when: 改修後に管理者が画像を設定してから、定期処理が画像化する（失敗して「今すぐ再実行」でやり直すときも）
    then: 2件のものは記録した2件の表紙が載り、0件のものは画像の欄が無い（どちらも設定の画像には変わらない）
  - id: AC-007-10
    given: この改修より前に承認し、過去の投稿の表紙を2件記録した投稿
    when: 改修後に下書きに戻し、保存し直して承認し、画像化する
    then: 過去の投稿の表紙は載らず、保存した時点の設定の最後のスライドの画像が載る
  - id: AC-007-11
    given: 編集者・承認者のロール、または他団体の管理者
    when: 最後のスライドの画像をアップロード・変更しようとする（画面を通さず直接要求する場合を含む）
    then: 拒否され、設定は変わらない。他団体のメンバーは画像を見られない
  - id: AC-007-12
    given: 管理者が、画面を通さずに 3枚の画像・同じ順の2枚・他団体の保存先・.png や .gif の保存先 で設定の保存を要求する
    when: サーバーが受け取る
    then: すべて拒否され、設定の新しい版はできない
  - id: AC-007-13
    given: 最後のスライドの画像の1枚が Storage に見つからない（ストレージの不整合）
    when: 定期処理が画像化する
    then: 投稿は失敗（画像化の失敗）になり、「最後のスライドの画像が見つかりません。管理者が画像を設定し直したあと、下書きに戻して保存し直してください」だけが表示される（「今すぐ再実行でやり直せます」は付かない）。その手順で直したあとは承認して画像化できる

non_functional:
  - id: NFR-007-01
    requirement: 最後のスライドの画像 0枚 / 1枚 / 2枚 のそれぞれで、画面のプレビューと定期処理の画像化が同じ見た目になる（NFR-002-04 と同じ方法・許容差で比べる）
    verify_by: test
  - id: NFR-007-02
    requirement: 最後のスライドの画像は Storage の非公開の場所に置き（ロゴと同じ）、書けるのは自分の団体の管理者だけ、読めるのは自分の団体のメンバーだけ（行レベルセキュリティ）
    verify_by: test

out_of_scope:
  - 投稿ごとに最後のスライドの画像を選び直すこと（設定の画像を全部の投稿で使う）
  - 3枚以上の画像・配置や枠の大きさを画面で変えること・2枚の左右の入れ替え
  - 画像の切り抜く位置を人が決めること（いつも中央を残す）
  - 公開済みの投稿の画像を作り直すこと
  - 改修前に保存した下書きを、自動で新しい設定の版に付け替えること（リリースの手順で保存し直す）
  - 最後のスライドの画像を AI で作ること

assumptions:
  - 画像の保存先・権限はロゴに合わせる（ADR-0010 決定5。団体の素材は公開リポジトリに置かず Storage の非公開の場所に置く）。形式はロゴと違い JPEG（写真のため）
  - 画像の画素数（400×500px 以上・800×1000px 以下）の検査は画面で行う。Storage に書けるのは自分の団体の管理者だけなので、サーバーは保存先・枚数・順を検査する
  - 画像をテンプレートにどう渡すか（最後のスライドの中身に入れて渡すか、投稿の型の設定から渡すか）は工程02で決める。
    いまの niijima@1 は最後のスライドの値で0〜2件の画像を受け取れるので、その形なら見た目も差し込みも変わらず niijima@1 のまま描ける。
    投稿の型の設定から渡す形にするなら ADR-0010 決定1 に従い niijima@2 を作る
  - 過去の投稿の表紙（PastPostCover）と承認ごとの記録（approval_past_posts）は、BR-007-05 のために読むだけ残す（新しくは作らない）。
    REQ-002 AC-002-15 にひも付いたテストは、AC-007-08・AC-007-09 に付け替える

open_questions: []   # 2026-11-03 梶原が回答: 移行はリリースの手順で対応／小さい画像は受け付けない／REQ-002 に置き換えの印を付けてよい
