# 出典: 「新島info Instagram自動投稿システム 要件定義書」（2026-10-01）5章 F-17〜F-18 / 9章 大学ニュースの収集
id: REQ-004
title: ネタ収集と効果分析（フェーズ4）
status: draft
background: |
  ネタ探しと「何が伸びたか」の振り返りを自動化する。大学公式ニュースから事実だけを抜き出してネタにし、
  公開後のInsightsを毎日蓄積して、ジャンル・形式・時刻別の傾向を企画生成に反映する。
  京愛の開発実績として、導入効果を数値で示せる形にする。
actors: [定期処理, 編集者, 承認者, 管理者]

concerns:
  - 大学の新着情報を見逃さないこと
  - 公式サイトの文章や写真を転載しないこと（著作権）
  - 伸びた投稿の傾向が数字で分かり、次の企画に使われること
  - 導入前後の効果（作業時間・投稿数・反応）を比べられること

business_rules:
  - id: BR-004-01
    rule: ニュースソース（RSSまたはページ差分）を1日1回取得し、新着だけをネタ（出どころ=大学ニュース、参照元URL付き）にする。同じURLは二度ネタにしない
    terms: [ニュースソース, ネタ, ネタの出どころ]
  - id: BR-004-02
    rule: ニュースからは事実（日時・場所・対象・手続き）だけを抜き出し、本文の転載や画像の取得はしない。他アカウントのInstagram投稿は取得しない
    terms: [ネタ, ニュースソース]
  - id: BR-004-03
    rule: 公開済み投稿のインサイト（リーチ・保存数・シェア数・いいね・コメント・閲覧数）を公開後30日間、1日1回取得して追記する
    terms: [インサイト, 投稿, 公開結果]
  - id: BR-004-04
    rule: 分析はジャンル・投稿種別・公開時刻帯（3時間区切り）ごとの、リーチあたり保存数・シェア数の中央値で行う
    terms: [インサイト, ジャンル, 投稿種別]
  - id: BR-004-05
    rule: 伸びた投稿は直近90日の公開済み投稿のうち、公開7日後時点のリーチあたり保存数の上位
    terms: [伸びた投稿, インサイト]

acceptance_criteria:
  - id: AC-004-01
    given: RSSに新着2件（うち1件は既にネタ化済みのURL）
    when: 日次のネタ収集が走る
    then: ネタは1件だけ増え、参照元URLが入っている
  - id: AC-004-02
    given: ニュースソースが500エラー / タイムアウト
    when: 日次のネタ収集が走る
    then: そのソースだけ失敗を記録し、他のソースとジョブ全体は続行する
  - id: AC-004-03
    given: 公開から3日目の投稿
    when: 日次のインサイト収集が走る
    then: その日のインサイトが1件追記され、同じ日に再実行しても重複しない
  - id: AC-004-04
    given: 公開から31日目の投稿
    when: 日次のインサイト収集が走る
    then: 取得しない
  - id: AC-004-05
    given: 公開7日後の保存数/リーチが 0.05, 0.10, 0.02, 0.08 の4投稿（直近90日）
    when: 伸びた投稿を3件選ぶ
    then: 0.10, 0.08, 0.05 の順で返る
  - id: AC-004-06
    given: リーチが0の投稿
    when: 分析する
    then: 0除算せず、比率の計算対象から除く

non_functional:
  - id: NFR-004-01
    requirement: ニュースの取得は1ソースあたり1日1回、User-Agentに連絡先を明記し、robots.txtに従う
    verify_by: review
  - id: NFR-004-02
    requirement: 分析レポートは週1回生成し、管理画面で見られる
    verify_by: monitoring

out_of_scope:
  - 他アカウントのInstagram投稿の収集（規約違反のため）
  - 公式サイトの写真の利用

open_questions:
  - 収集対象のニュースソース（URL・RSSの有無）
  - 導入前のベースライン計測（1投稿あたりの作業時間を工程別、週あたりの投稿数、直近数か月の平均リーチ・保存数・フォロワー増加ペース）
  - Insightsで取得できる指標名の最新仕様（impressions の廃止など）をフェーズ0で確認
  - 事例公開の許諾と、運営コメントの提供可否
