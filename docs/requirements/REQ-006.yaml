# 出典: 梶原の依頼（2026-10-11）「AIで作るの機能に修正・背景画像も生成できる様にしてほしい・帯の色を7色に」
# 位置づけ: REQ-002（AIで下書き）と REQ-005（AIで画像）の改修。承認済みの REQ-002・REQ-005 は変えず、この要件が次の点を置き換える・足す
#   - REQ-002 BR-002-12 の「帯の色はアクセント色（紫・赤・青緑の3つだけ）」→ 7色にする
#   - REQ-002 AC-002-11 の「アクセント色『緑』は違反」→ 緑は有効になる（違反の例は黄に替える）
#   - REQ-002 BR-002-14・BR-002-21（背景写真は管理者が登録する）→ 生成した背景は、下書きを作るメンバーが背景写真として登録できる
#   - REQ-005 の対象外「生成画像をテンプレートの背景として使うこと（REQ-002 のテンプレートと合わせて足す）」→ この要件で扱う
id: REQ-006
title: AIで作る・表紙の背景画像を生成する／帯の色を7色にする（改修）
status: approved   # 2026-10-11 梶原が承認
background: |
  「AIで作る」で表紙を作るとき、背景は管理者が登録した背景写真から選ぶ（REQ-002）。写真が少ないと表紙が似た見た目になり、
  登録のたびに管理者の手間がかかる。REQ-005 の画像生成（候補4枚から選ぶ）を、表紙の背景にも使えるようにする。
  あわせて、表紙の3段目の帯の色が紫・赤・青緑の3つだけで変化が少ないため、7色に増やす。
  決まっていること（2026-10-11 梶原）:
    ・帯の色は、いまの3色（紫・赤・青緑）に 青・緑・オレンジ・ピンク を足した7色
    ・背景の生成は、表紙の編集の「背景」の選択に「AIで作る」を足す（登録した写真から選ぶのと並べる）
    ・作った背景は背景写真として登録し、ほかの投稿でも使えるようにする
actors: [編集者, 承認者, 管理者, 画像生成の提供元, Gemini API]

concerns:
  - 表紙の見た目にバリエーションが出て、同じ背景が続かないこと
  - 画像生成の無料枠（1日の回数）を使い切らず、上限に達しても作業が止まらないこと（REQ-005 と同じ）
  - AI が作った背景を実際の写真と誤解させないこと（背景・イラストだけを作る。写真風は作らない）
  - 帯の新しい4色でも、白抜きの締めの言葉が読めること。画面のプレビューと公開用の画像で同じ色になること
  - 生成した背景が増えすぎて、背景写真の一覧（上限30枚）を埋めてしまわないこと
  - すでに承認済み・公開済みの投稿（3色の帯）の見た目が変わらないこと

business_rules:
  - id: BR-006-01
    rule: |
      アクセント色は7つ: 紫・赤・青緑（いまの3色）・青・緑・オレンジ・ピンク。表紙の帯の色は、AI が7色から選び、人が選び直せる。
      7色以外（黄・水色など）の出力は違反として扱う（BR-002-03 の違反と同じ。1回だけ再生成させる）。
      承認済み・公開済みの投稿の帯の色は変わらない（旧3色のまま画像化できる）
    terms: [アクセント色, 表紙の文言, 下書き案]
  - id: BR-006-02
    rule: |
      表紙の編集で、背景の選択に「AIで作る」を足す。作りたい背景を日本語で書くと（1〜500文字。REQ-005 の画像生成の指示と同じ）、
      REQ-005 の画像生成で候補を4枚作り、人が1枚を選ぶ（自動では選ばない）。選んだ候補を、作られたときの形（正方形）のまま背景写真として登録し
      （サーバーが候補の画像を背景写真の保存先に複製する。表紙の枠に合わせて切り取るのは画像化のとき）、その投稿の表紙の背景にする。
      画像生成の検査・英訳・回数・失敗は REQ-005 に従う（1回の画像生成を、画像生成の回数の1回と数える）
    terms: [背景写真, 画像生成, 画像生成の指示, 候補, 背景写真としての採用, 表紙の中身]
  - id: BR-006-03
    rule: |
      表紙の背景として作る画像の種類は「背景・イラスト」だけ。「写真風」は選べない（画像に文字を描かせないのも REQ-005 と同じ）。
      背景・イラストだけの投稿には、AI生成の表示（キャプション末尾・AI info）も承認時の確認表示も付かない（REQ-005 BR-005-01）
    terms: [画像の種類, 生成画像, AI生成の表示]
  - id: BR-006-04
    rule: |
      生成した背景は、下書きを作れるメンバー（全ロール。REQ-005 BR-005-02 と同じ）が、候補を選んだ操作の一部として背景写真に登録できる
      （管理者の登録画面を通さない）。登録した背景写真は、ほかの投稿でも選べ、AI が話題に合う背景写真を選ぶとき（BR-002-14）の候補にもなる。
      背景写真の出どころ（管理者が登録した写真／AI が作った背景）は、採用の記録があるかどうかで分かる。AI が作った背景は、元の画像生成と候補の位置を記録する。
      説明文（1〜100文字）の初めの値は、画像生成の指示の改行を空白にまとめて先頭100文字（コードポイント）に切ったものとし、登録のときに人が直せる。
      説明文に改行・制御文字は入れられない（AI に渡す写真の一覧が1行1枚で並ぶため）
    terms: [背景写真, 背景写真一覧, 背景写真としての採用, 背景写真の出どころ, 画像生成, ロール]
  - id: BR-006-05
    rule: |
      「背景写真としての採用」は、REQ-005 の候補の採用と同じ条件（採用できる候補: 自分の団体の成功した画像生成の候補）に加えて、
      候補の画像がまだ残っている（片付けられていない）ときだけ受け付ける。候補が「背景・イラスト」のものでなければ受け付けない。
      同じ候補を二重に背景写真にしない（もう一度要求されたときは、すでに作った背景写真を返す）。背景写真は団体ごとに最大30枚で、AI が作った背景も数える（BR-002-21）。
      30枚に達しているときは、「AIで作る」を出さず（または押せず）、「管理者が使わない写真を整理してください」と案内する。
      サーバー側でも30枚を超える登録を拒否する
    terms: [背景写真, 背景写真一覧, 採用できる候補, 団体]
  - id: BR-006-06
    rule: |
      背景の画像生成が使えないとき（画像生成の上限・英訳できない・提供元の失敗・指示の検査で拒否）は、表紙の背景は変わらず、下書き案も失われない。
      理由と、「登録した背景写真から選ぶ」で続けられることを示す（BR-002-22 と同じ扱い）
    terms: [画像生成の回数, 画像生成の上限, 背景写真, 下書き案]
  - id: BR-006-07
    rule: |
      AI が作った背景写真も、使っている投稿があるときは消さず、管理者が「使わない」にできる（BR-002-21 と同じ）。
      背景を使った投稿の画像化は、登録した写真と同じ方法で行う（暗くして3段の文字を載せる）。見つからなければ画像化の失敗（BR-002-02）
    terms: [背景写真, ロール, 表紙の中身]

acceptance_criteria:
  - id: AC-006-01
    given: AI の出力の表紙の帯の色が 紫 / 赤 / 青緑 / 青 / 緑 / オレンジ / ピンク（7つ）、または 黄 / 水色（7色以外）
    when: 下書き案にする
    then: 7つは受け付ける。黄・水色は違反として1回だけ再生成させる（AC-002-11 の「緑は違反」は有効に変わる）
  - id: AC-006-02
    given: 下書き案の表紙の帯の色が 紫 のとき
    when: 人が 青 / 緑 / オレンジ / ピンク に選び直す
    then: プレビューの帯が選んだ色になり、保存・承認依頼ができる。修正指示の作り直しでも、選び直した色は保たれる
  - id: AC-006-03
    given: 旧3色（紫・赤・青緑）の帯で承認済みの投稿
    when: 定期処理が画像化する
    then: これまでと同じ色・同じ見た目の1080×1350のJPEGになる
  - id: AC-006-04
    given: 表紙の編集で背景の選択を開いている（背景写真は12枚、画像生成の回数に余裕がある）
    when: 「AIで作る」で「夕暮れの京都御苑、やわらかい光」と書いて生成し、候補4枚から2枚目を選ぶ
    then: 背景写真が13枚になり、その写真（出どころ=AI が作った背景）が表紙の背景になる（選んだ画像は一覧にも出る）。説明文の初めの値は指示の文（複数行の指示や101文字以上の指示は、改行を空白にまとめて100文字に切る）。画像生成の回数は1回分増える
  - id: AC-006-05
    given: 背景の指示が 0文字 / 1文字 / 500文字 / 501文字
    when: 生成する
    then: 1文字・500文字は生成できる。0文字・501文字は指示の検査で拒否し、画像生成の回数も使わない
  - id: AC-006-06
    given: 表紙の背景を「AIで作る」の画面
    when: 開く。また、写真風の候補を直接背景写真にしようとする
    then: 画像の種類は「背景・イラスト」の固定の表示で、「写真風」は選べない。写真風の候補を直接要求しても拒否され、背景写真は増えない
  - id: AC-006-07
    given: 背景写真が 29枚 / 30枚 の団体
    when: 背景を生成して候補を選ぶ
    then: 29枚なら登録でき30枚になる。30枚なら「AIで作る」を出さず、サーバーに直接要求しても登録を拒否し、背景写真は増えない
  - id: AC-006-08
    given: 画像生成の回数が上限に達している（1日20回目まで使い切った）
    when: 背景を「AIで作る」で生成しようとする
    then: 生成せず、「今日の画像生成は上限に達しました。登録した背景写真から選んでください」と案内する（英訳できない・提供元の失敗のときも、背景を作れないことと登録した背景写真から選べることを案内する）。表紙の背景と下書き案は変わらない
  - id: AC-006-09
    given: 編集者（背景写真を登録できないロール）が下書きを作っている
    when: 背景を生成して選ぶ
    then: 登録できる（管理者の画面を通さない）。他団体のメンバーは他団体の候補を採用できない
  - id: AC-006-10
    given: 片付け済みの候補、他団体の候補、すでに背景写真にした候補
    when: 背景写真として採用しようとする
    then: すべて拒否し、背景写真は増えない
  - id: AC-006-11
    given: 作った背景の写真が背景写真の一覧にある
    when: 別の投稿で下書き案を生成する
    then: その写真が背景の候補に出て、AI が話題に合うと判断すれば選ばれる。人が選び直すこともでき、説明文は登録のときに直せる
  - id: AC-006-12
    given: AI が作った背景を使っている承認済みの投稿
    when: 管理者がその背景写真を消そうとする
    then: 消えずに「使わない」になり、以後の候補から外れる。その投稿の画像化には使える
  - id: AC-006-13
    given: AI が作った背景だけを使った投稿（中のスライドの素材画像は背景・イラスト、または無い）
    when: 承認を依頼し、公開する
    then: AI生成の表示もAI info（is_ai_generated）も承認時の確認表示も付かない
  - id: AC-006-14
    given: AI が作った背景の写真が見つからない（ストレージの不整合）
    when: 定期処理が画像化する
    then: 投稿は失敗（画像化の失敗）になり、理由が表示される。「今すぐ再実行」でやり直せる

non_functional:
  - id: NFR-006-01
    requirement: 新しい4色（青・緑・オレンジ・ピンク）は、帯の左端・右端のどちらの色でも、白抜きの締めの言葉との明るさの比が 3:1 以上になる（満たさない色は濃くする）。既存の3色は公開中の投稿から読み取った値のまま変えない
    verify_by: test
  - id: NFR-006-02
    requirement: 7色すべてで、画面のプレビューと定期処理の画像化の帯の色が同じになる（NFR-002-04 を7色に広げる）
    verify_by: test
  - id: NFR-006-03
    requirement: 背景の画像生成の提供元と Gemini のキーはブラウザに渡さない（API関数からだけ呼ぶ。REQ-005 NFR-005-01 と同じ）。背景写真の登録は、他団体の候補・他団体の写真に対して行えない（行レベルセキュリティ）
    verify_by: test
  - id: NFR-006-04
    requirement: 背景写真の最大30枚は、同時に2人が登録しても超えない
    verify_by: test

out_of_scope:
  - 写真風の背景（AI生成の表示が付くため。必要になったら別の要件で扱う）
  - 中のスライドの背景や、最後のスライドの背景の生成（中のスライドの素材画像は REQ-002 の「絵を作る」）
  - 「生成」を押したときに、ネタから AI が背景の指示を考えて自動で作ること（人が指示を書いたときだけ作る）
  - 管理画面から帯の色を足す・変えること（色はコードとテンプレートの版で決める）
  - 背景写真の説明文を、画像から AI が自動でつけること

assumptions:
  - 帯の色の値（4色のグラデーションの左端・右端）は設計で決め、見本の画像で梶原が確認する（設計書 REQ-006 に記録）
  - 背景の生成は画像生成の回数（1日20回。仮置き）を REQ-005 の画像生成と共有する。背景を作りすぎると、中のスライドの絵を作る回数が減る
  - 帯の色の値はテンプレートではなくアクセント色（コード）が持ち、テンプレートは色の値を受け取って描くだけなので、テンプレートの版は変えない（niijima@1 のまま）。承認済み・公開済みの投稿の帯は、保存した色のコードのまま同じ値で描ける

open_questions: []   # 2026-10-11 梶原が回答: 全ロールが登録してよい／画像生成の上限は20回のまま。色の値は設計の見本で確認する（assumptions）
