# 出典: 2026-10-02 梶原の依頼「画像に関しても自動生成するAIとの連携を考えたい」（用途: 背景・イラスト、写真風の画像）
# REQ-002 では「画像そのものをAIで生成すること」を対象外にしていた。それを切り出して扱う
# 2026-10-02 design-reviewer の要件レビュー（Critical 2・Major 12・Minor 6）を反映
id: REQ-005
title: AIで投稿画像（背景・イラスト・写真風）を生成する
status: approved   # 2026-10-04 梶原が承認
background: |
  投稿画像は、テンプレート（REQ-002）と運営が撮った写真だけで作る前提だった。
  撮影できない話題（締切のお知らせ・季節の話題・抽象的なテーマ）では使える画像が無く、
  フリー素材を探す手間がかかっている。文字で指示すると画像の候補を AI が作り、人が選んで投稿画像にできるようにする。
  一方、新島info は学生向けのニュースメディアなので、AI が作った画像を「実際の写真」と誤解させないことが信用の要になる。
  フェーズ1の本番稼働の直後、REQ-002 より先に作る（2026-10-02 梶原）。このとき生成画像は、文字の無い投稿画像としてそのまま使う。
actors: [編集者, 承認者, 管理者, 定期処理, 画像生成の提供元, Gemini API]

# 用語（工程02で domain.yaml に登録する。既存の「生成」= LLM に下書き案を作らせた出来事 とは別のコト）
#   画像生成   : 指示から候補を作った1回の出来事（ImageGeneration）
#   候補       : 画像生成で作られ、まだ採用されていない画像
#   生成画像   : 採用されて投稿画像になった候補。画像の種類を持つ（「AI画像」とは呼ばない）
#   画像の種類 : 背景・イラスト / 写真風（区分）
#   候補の採用 : 人が候補を選んで投稿画像にした出来事
#   画像生成の提供元 : 画像を作る外部サービスとモデル（LLM の提供元とは別の設定）

concerns:
  - 撮影できない話題でも、すぐに投稿に使える画像が手に入ること
  - AI が作った画像を、実際の出来事の写真だと読者に誤解させないこと（ニュースメディアとしての信用）
  - 実在の人物・他人の作品・商標を描いた画像を投稿に使わないこと
  - 無料枠の範囲で使い、課金や停止が起きないこと。上限に達しても投稿作業が止まらないこと
  - どんな指示でどの候補が作られ、どれが採用されたかが後から分かること

business_rules:
  - id: BR-005-01
    rule: |
      画像の種類は「背景・イラスト」と「写真風」の2つ。種類ごとの違いは次のとおり（区分ごとの振る舞い）
        | 振る舞い                                   | 背景・イラスト | 写真風 |
        | 生成時の注意書き（BR-005-09）              | 出さない       | 出す   |
        | 承認時の確認表示（BR-005-09）              | 出さない       | 出す   |
        | キャプションのAI生成の表示（BR-005-04）    | 付けない       | 付ける |
        | Instagram の AI info（is_ai_generated）    | 付けない       | 付ける |
      どちらも画像に文字を描かせない。このフェーズでは文字の無い投稿画像としてそのまま使う
    terms: [画像の種類, 生成画像, 投稿画像]
  - id: BR-005-02
    rule: 画像生成はすべてのロール（管理者・承認者・編集者）が使える。使い方は承認で人が確かめる
    terms: [画像生成, ロール]
  - id: BR-005-03
    rule: |
      画像生成の指示は1〜500文字の日本語。1回の画像生成で候補を4枚作る。縦横比は4:5、カルーセルの2枚目以降に足すときは1枚目の縦横比に合わせる。
      提供元が返した候補が1〜3枚ならある分だけ示し、0枚なら画像生成は失敗とする。
      候補は人が選んだものだけを投稿画像にする（自動で投稿に入れない）。1回の画像生成から複数の候補を採用してよい（カルーセルの上限10枚まで）
    terms: [画像生成, 画像生成の指示, 候補, 投稿画像, 投稿画像一覧]
  - id: BR-005-04
    rule: |
      採用した候補は、BR-001-03 の画像仕様に、アップロード時と同じ変換で合わせてから投稿画像にする
    terms: [候補, 生成画像, 画像仕様]
  - id: BR-005-05
    rule: |
      写真風の生成画像を1枚でも含む投稿は、公開時にAI生成の表示を付ける。背景・イラストだけの投稿には付けない（2026-10-02 梶原の判断）。
      キャプションへの表示は、本文（ハッシュタグを含む）の末尾に改行1つと「※画像はAIで生成したイメージです」（改行込み18文字）を付ける。
      公開用キャプションの文字数は BR-001-05 に従い、付記（先頭のPR表記・末尾のAI生成の表示）をすべて含めて2,200文字以下。超えるときは「{付けた付記}を含めて2,200文字以内にしてください」で承認依頼を拒否する。
      あわせて Instagram の AI info を付ける（メディアコンテナ作成時の is_ai_generated=true。画像なら単体のコンテナ、カルーセルなら親コンテナ。公式の Content Publishing に記載、2026-10-02 確認）。
      AI info が実際には表示されない場合も、キャプションの表示で開示を満たすものとする
    terms: [AI生成の表示, 生成画像, 画像の種類, キャプション, PR区分, 投稿]
  - id: BR-005-06
    rule: |
      指示の検査: メールアドレス・電話番号の形式、その投稿の元になった PR入稿の入稿者連絡先（団体名・担当者名・連絡先）を含む指示は、生成しない（機械で検査する）。
      実在の人物名・他人の作品・キャラクター・商標は機械では判定できないため、指示で求めないよう生成時に注意書きを出し、承認で人が確かめる
    terms: [画像生成の指示, 入稿者連絡先, PR入稿]
  - id: BR-005-07
    rule: |
      画像生成の回数: 団体ごとに、1日（日本時間 9:00 から翌 9:00。提供元の無料枠の区切りに合わせる）の画像生成の回数を数える。候補4枚を作る1回の画像生成を1回と数える。
      上限は団体の設定値（画像生成の上限。仮置き1日20回。無料枠に収まるかを実測して見直す）。上限の8割に達したら警告を出し、上限に達したら提供元を呼ばず、写真を撮る・選ぶで続けるよう案内する
    terms: [画像生成の回数, 画像生成の上限, 団体, 警告]
  - id: BR-005-08
    rule: |
      記録（追記のみ。変更・削除しない）:
        画像生成（生成した時点）: 依頼したメンバー・日時・画像の種類・日本語の指示・英訳した指示・提供元とモデル名・結果（成功／失敗）・作った候補の数
        候補の採用（選んだ時点）: どの画像生成のどの候補を、どの投稿に、誰がいつ採用したか。採用が無いことは「採用の記録が無い」で表す
      指示の検査で拒否した指示は記録しない（個人情報を含みうるため）
    terms: [画像生成, 候補の採用, 画像生成の指示, 候補, メンバー]
  - id: BR-005-09
    rule: |
      写真風の生成画像は、季節・雰囲気・抽象的な話題の「イメージ写真」としてだけ使う。実際の出来事・場所・人を撮ったように見せる使い方はしない（2026-10-02 梶原の判断）。
      PR案件でも使ってよい（2026-10-02 梶原の判断）。その場合も PR表記とAI生成の表示の両方を付ける。
      機械では判定できないため、写真風を選んだときに注意書きを出し、承認者には写真風の生成画像を含む投稿であることを示して、承認で人が確かめる
    terms: [生成画像, 画像の種類, 投稿, PR区分]
  - id: BR-005-10
    rule: |
      処理の順番: ①指示の検査（BR-005-06）→ ②英訳 → ③画像生成の回数を1回分確保（BR-005-07）→ ④提供元で候補を作る → ⑤記録。
      ②英訳: 日本語の指示を Gemini（テキスト生成）で英語に直してから提供元に渡す（2026-10-02 梶原の判断）。呼ぶ前に LLM利用回数を1回分確保する。
      英訳できないとき（LLM上限に達している・Gemini が失敗した）は画像生成しない。「いまは画像を作れません。写真を撮る・選ぶで続けてください」と案内し、
      画像生成の回数は使わず、画像生成としても記録しない（提供元を呼んでいないため）。Gemini が失敗したときに確保した LLM利用回数1回は戻さない。
      日本語のまま提供元に渡さない（2026-10-04 の試作で内容が反映されない・誤判定で拒否されると分かった。2026-10-04 梶原の判断）。
      使う LLM の提供元・モデルは団体の設定値（REQ-002 BR-002-09 と共有）。REQ-005 では LLM利用回数の確保と上限の判定までを作り、警告・手動コピペは REQ-002 で足す
    terms: [画像生成の指示, LLM利用回数, LLM上限, 団体]
  - id: BR-005-11
    rule: |
      採用されなかった候補の画像は残さない（2026-10-02 梶原の判断）。採用の操作を終えた時点で残りの候補の画像を消す。
      採用せずに閉じた・放置された候補の画像は、翌日の定期処理（daily）で消す。記録（BR-005-08）は残す
    terms: [候補, 候補の採用, 画像生成]
  - id: BR-005-12
    rule: 画像生成の提供元とモデル名は団体の設定値で、コード変更なしに差し替えられる（LLM の提供元とは別の設定）。既定の選定は ADR で決める
    terms: [画像生成の提供元, 団体]

acceptance_criteria:
  - id: AC-005-01
    given: 種類「背景・イラスト」、指示「桜並木のやわらかい水彩風の背景」、提供元が候補を4枚返す
    when: 画像生成する
    then: 候補が4枚表示される。画像生成として指示・英訳した指示・種類・モデル名・結果「成功」・候補4枚が記録される
  - id: AC-005-02
    given: 指示が 0文字 / 1文字 / 500文字 / 501文字
    when: 画像生成する
    then: 0文字と501文字は「指示は1〜500文字です」で拒否され、1文字と500文字は生成される
  - id: AC-005-03
    given: 指示に「taro@example.com」/「090-1234-5678」を含む
    when: 画像生成する
    then: 「個人を特定できる情報は指示に含められません」で拒否される。Gemini も提供元も呼ばれず、画像生成の回数・LLM利用回数は増えず、記録も残らない
  - id: AC-005-04
    given: 写真風の生成画像を1枚含む投稿で、本文が 2,182文字 / 2,183文字（PR区分=通常）
    when: 承認を依頼する
    then: 2,182文字は受け付け、公開用キャプションは末尾に改行と「※画像はAIで生成したイメージです」が付いて2,200文字になる。2,183文字は「AI生成の表示を含めて2,200文字以内にしてください」で拒否される
  - id: AC-005-05
    given: 背景・イラストの生成画像だけの投稿
    when: 公開される
    then: 公開用キャプションにAI生成の表示は付かず、コンテナ作成に is_ai_generated は付かない
  - id: AC-005-06
    given: 画像生成の上限が1日20回で、今日（9:00以降）すでに 14回 / 15回 / 19回 / 20回 画像生成している
    when: もう1回画像生成する
    then: 14回なら警告なしで生成、15回なら生成して「画像生成の上限が近い」警告、19回なら生成して警告（20回目は通る）、20回なら提供元を呼ばず「今日の画像生成は上限に達しました。写真を撮る・選ぶで続けてください」と表示する
  - id: AC-005-07
    given: 提供元がエラーを返す / 60秒以内に応答しない / 候補を0枚返す
    when: 画像生成する
    then: 「画像を生成できませんでした」と表示され、作成中の投稿の内容は失われない。画像生成は結果「失敗」で記録される
  - id: AC-005-08
    given: 写真風の生成画像を含む承認待ちの投稿
    when: 承認者が投稿詳細を開く
    then: 「写真風の生成画像を含みます。実際の出来事・場所・人の写真として使っていないか、実在の人物・商標が写っていないか確認してください」と表示される。背景・イラストだけの投稿には表示されない
  - id: AC-005-09
    given: 種類「写真風」を選んだ
    when: 指示を入力する
    then: 「イメージ写真としてだけ使えます。実際の出来事・場所・人を撮ったように見せる使い方や、実在の人物・商標を求める指示はできません」と注意書きが出る
  - id: AC-005-10
    given: PR案件で写真風の生成画像を含み、PR表記「【PR】」+改行（5文字）、本文 2,177文字 / 2,178文字
    when: 承認を依頼する
    then: 2,177文字は受け付け、公開用キャプションは先頭にPR表記、末尾にAI生成の表示が付いて2,200文字になる。2,178文字は「PR表記とAI生成の表示を含めて2,200文字以内にしてください」で拒否される
  - id: AC-005-11
    given: 写真風の生成画像を含む、カルーセル3枚の承認済みの投稿
    when: 定期処理が公開する
    then: 親コンテナの作成に is_ai_generated=true が付く
  - id: AC-005-12
    given: 4枚の候補のうち2枚を採用する
    when: 採用を確定する
    then: 2枚が画像仕様を満たす投稿画像として投稿画像一覧の末尾に加わり（2枚以上ならカルーセル）、候補の採用が2件記録される。残りの2枚の画像は消え、画像生成の記録は残る
  - id: AC-005-13
    given: 候補を1枚も採用せずに閉じた画像生成（前日）
    when: daily の定期処理が走る
    then: その候補の画像が消え、画像生成の記録は残る。採用の記録は無い
  - id: AC-005-14
    given: LLM上限に達している / Gemini がエラーを返す / Gemini が英訳を返す
    when: 画像生成する
    then: 上限のときは Gemini も提供元も呼ばず「いまは画像を作れません。写真を撮る・選ぶで続けてください」と表示され、LLM利用回数・画像生成の回数は増えず、記録も残らない。エラーのときも提供元を呼ばず同じ表示になり、LLM利用回数だけ1回増える。英訳を返したときは英訳した指示が提供元に渡り、画像生成の回数が1回増え、英訳した指示が記録される
  - id: AC-005-15
    given: 編集者
    when: 画像生成し、候補を採用する
    then: どちらもできる
  - id: AC-005-16
    given: 団体設定の画像生成のモデル名を別のモデルに変えた
    when: 画像生成する
    then: コード変更なしに新しいモデル名で呼ばれ、記録にそのモデル名が残る
  - id: AC-005-17
    given: 記録済みの画像生成と候補の採用
    when: 画面（authenticated）から変更・削除しようとする
    then: 拒否される（追記のみ）

non_functional:
  - id: NFR-005-01
    requirement: 画像生成の提供元と Gemini のキーはブラウザに渡さない（API関数からだけ呼ぶ）
    verify_by: test
  - id: NFR-005-02
    requirement: ランニングコスト月額0円。提供元は無料枠を超えたら課金ではなく停止する設定にする（REQ-001 NFR-001-01）
    verify_by: review
  - id: NFR-005-03
    requirement: 画像生成の回数の確保は、同時に呼ばれても上限を超えない（原子的に加算）
    verify_by: test
  - id: NFR-005-04
    requirement: 画像生成（英訳を含む）は p95 で30秒以内、全体のタイムアウトは60秒。スマホの画面から待てる長さにする
    verify_by: monitoring

out_of_scope:
  - 生成画像をテンプレートの背景として使うこと（REQ-002 のテンプレートと合わせて足す）
  - 画像の中に文字を描かせること（文字はテンプレートで載せる。AI は日本語の文字が崩れやすい）
  - 運営が撮った写真の加工・修整（顔の差し替え・背景の合成など）
  - 動画（リール）の生成
  - LLM上限の警告・手動コピペ（REQ-002 で扱う）

# 前提（あとで確かめる作業。外れても要件は変わらない）
assumptions:
  - is_ai_generated を付けた投稿に Instagram の「AI info」が表示される。フェーズ0のテスト投稿で確かめる（表示されなくてもキャプションの表示で要件は満たす。BR-005-05）

open_questions: []
# 2026-10-04 梶原が確認・了承:
#   - 写真風を「イメージ写真としてだけ使う」決まり（BR-005-09）
#   - Cloudflare Workers AI（FLUX.1 [schnell]。モデルは Apache 2.0 で生成物の商用利用可）の利用条件。結論は工程03で ADR に書く
#   - Gemini 無料枠（Unpaid Services）の利用条件（REQ-002 と共通。ADR-0004）。2026-10-02 に規約で確認した内容:
#     業務目的の開発者の利用は可（消費者向けは対象外）／無料枠を使えないのは EEA・スイス・英国の利用者向け（日本は対象外）／
#     API の利用者は18歳以上（契約者は京愛）／入力と出力は Google の改善に使われ、人が読むことがある → 個人情報・機密を送らない（BR-005-06 で弾く）
# 2026-10-04 試作（Cloudflare Workers AI の FLUX.1 [schnell]、ks.factory202605 のアカウント、作業用フォルダの使い捨ての Worker）:
#   - 英語の指示: 背景・イラスト（桜並木の水彩、締切の砂時計とカレンダー）・写真風（試験期間の机、秋祭りの夜店）とも投稿に使える品質。1枚 1.2〜2.2 秒
#   - 日本語の指示: 1件は内容が反映されず無関係な雪景色、1件は「NSFW」と誤判定で拒否 → 英訳は必須
#   - 「文字なし」と指示しても看板・紙に崩れた文字が出ることがある。イラストに架空のサインが入ることがある。人物が写ることがある → 承認で人が確かめる（BR-005-09）
#   - steps 8 は 4 と比べて明確な差が無く時間は約2倍 → 既定4
#   - 出力は 1024×1024 の正方形（縦横比は指定できない）→ 4:5 に切り取って使う（819 幅相当。画像仕様の範囲内）
#   - 消費: 1枚 57.6 Neurons（4タイル×4.8＋4ステップ×9.6）、候補4枚で約230 → 無料枠（1日10,000）で約43回。上限20回なら約46%
#   → 上限の値（仮置き20回）は無料枠に収まることを確認した。モデルの選定は FLUX.1 [schnell] でよい
# 決定済み（2026-10-02 梶原）:
#   - 写真風はイメージ写真としてだけ使う（BR-005-09）。PR案件でも使ってよい
