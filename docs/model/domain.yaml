# docs/model/domain.yaml — 用語集兼ドメインモデル（Single Source of Truth）
# 出典: 「新島info Instagram自動投稿システム 要件定義書」（2026-10-01, Claude Docs）
# kind: value | entity | aggregate | collection | kubun | state | rule | service | event
# category: hito（ヒト）| mono（モノ）| koto（コト）
# 状態: 下書き（AIによる初版）。値に「要確認」とあるものはフェーズ0で確定する
context: 新島info投稿運用
terms:
  # ───────── ヒト ─────────
  - name_ja: 団体
    code_name: Tenant
    kind: entity
    category: hito
    definition: システムを利用する組織。当面は新島info の1件のみ。将来のマルチテナント化の単位
    identity: 団体ID
    behaviors:
      - 利用するLLMのモデル名・LLM上限・公開猶予を設定として返す
    related: [メンバー, Instagram連携, LLM上限, 公開猶予]
    avoid: [組織, テナント情報]

  - name_ja: メンバー
    code_name: Member
    kind: entity
    category: hito
    definition: 管理画面にログインできる人。許可リストに載ったGoogleアカウントで識別する
    identity: メンバーID（ログイン前はGoogleアカウントのメールアドレス）
    invariants:
      - 1人に1つのロールを持つ
      - 無効化されたメンバーはログインできない（削除せず無効化を記録する）
    behaviors:
      - ロールに従って操作できるかを判断する
    related: [団体, ロール]
    avoid: [利用者アカウント, UserInfo]

  - name_ja: ロール
    code_name: Role
    kind: kubun
    definition: メンバーができる操作の範囲
    values:
      - {code: ADMIN, name_ja: 管理者}
      - {code: APPROVER, name_ja: 承認者}
      - {code: EDITOR, name_ja: 編集者}
    behaviors:
      - 承認・予約の確定ができるか（ADMIN, APPROVER）
      - メンバーを追加・削除（無効化）・ロール変更できるか（APPROVER, ADMIN。運用は新島info側の承認者が担う。管理者ロールの付与・変更は ADMIN のみ）
      - テンプレート・プロンプト版・Instagram連携・投稿の型の設定・背景写真を管理できるか（ADMIN）
      - 下書きの作成・編集・承認依頼ができるか（全ロール）
    related: [メンバー]
    avoid: [権限フラグ, isAdmin]

  # ───────── Instagram 連携 ─────────
  - name_ja: Instagram連携
    code_name: InstagramConnection
    kind: aggregate
    category: koto
    definition: 新島infoのInstagramアカウントに、システムが代わりに投稿してよいという許可（OAuthで得たアクセストークン）の記録
    identity: 団体ID（1団体1連携）
    promises:
      do:
        - アクセストークンは暗号化して保持し、画面・ログ・LLMに出さない
        - トークン有効期限の残りを毎日確認し、更新できるものは更新する
      dont:
        - Instagramアカウント本体のパスワードを預かること
        - 連携が切れている間の投稿を後から自動で取り戻すこと（失敗として記録し人が再実行する）
    invariants:
      - 連携中はIGユーザーID・アクセストークン・トークン有効期限がそろっている
    behaviors:
      - 更新が必要かを判断する（トークン有効期限による）
      - 警告が必要かを判断する
      - 新しいトークンで更新される（更新の記録を追記）
      - 連携し直される（前の連携は同時に解除し、1団体に1つを保つ）
      - 解除される（団体の未解除の連携をすべて解除する）
    related: [アクセストークン, トークン有効期限, 団体]
    avoid: [IG設定, トークン情報]

  - name_ja: アクセストークン
    code_name: AccessToken
    kind: value
    definition: Instagram APIを呼ぶための長期アクセストークン。保存時は暗号化した形で扱う
    invariants:
      - 空文字でない
      - 文字列表現（toString）では値を伏せる
    related: [Instagram連携]

  - name_ja: トークン有効期限
    code_name: TokenExpiry
    kind: value
    definition: アクセストークンが失効する日時
    invariants:
      - 日時（タイムゾーン付き）であること
    behaviors:
      - 残り日数を返す
      - 更新が必要か（残り30日以下。要確認）
      - 警告が必要か（残り14日以下。要確認）
      - 意図的にワークフローを失敗させるか（残り7日以下かつ更新失敗。要確認）
    related: [Instagram連携]

  # ───────── 投稿 ─────────
  - name_ja: 投稿
    code_name: Post
    kind: aggregate
    category: koto
    definition: Instagramのフィードに1回公開する単位。下書きから公開済み／失敗までの一連の出来事
    identity: 投稿ID
    promises:
      do:
        - 承認された投稿の版の内容だけを公開する（承認後に設定・テンプレートが変わっても、承認した版が使った版で公開する）
        - PR区分がPRの投稿は、キャプションの先頭にPR表記を必ず付けて公開する
        - 公開の成否と失敗理由を投稿履歴に記録する
        - 同じ投稿を二重に公開しない
      dont:
        - 予約日時ぴったりの公開（定期処理の間隔15分の範囲で遅れる）
        - 公開猶予を過ぎた投稿の自動公開（失敗として人に判断を戻す）
        - 公開後の内容の編集（Instagram側で行う）
    invariants:
      - 承認待ち以降は投稿の版が確定している
    behaviors:
      - 承認を依頼する
      - 承認する（予約日時を確定し予約中にする。テンプレートの投稿は、最後のスライドに載せる過去の投稿をこの時点で選んで版に記録する）
      - 修正指示を受ける（下書きに戻す）
      - 予約を取り消す
      - 公開を始める／公開済みになる／失敗する
      - 再実行する（失敗から予約中に戻す）
      - 公開用キャプションを作る（組み立ては公開用キャプションに委ねる）
    related: [投稿の版, 投稿種別, 公開用キャプション, 予約日時, 投稿状態, 投稿履歴, 公開結果, 失敗理由]

  - name_ja: 投稿の版
    code_name: PostRevision
    kind: value
    definition: |
      投稿の内容の1つの版。保存のたびに新しい版を作り、承認するとその版が公開される内容になる。
      中身は「投稿画像一覧（写真をアップロードした投稿）」か「スライド構成＋テンプレートの版（テンプレートの投稿）」のどちらか一方と、
      キャプション・追加のハッシュタグ（0〜5個）・PR区分・投稿の型の設定の版。
      最後のスライドに載せる過去の投稿は版の中身ではなく、承認のたびに決まる（承認の出来事に記録する）
    invariants:
      - 投稿画像一覧とスライド構成のどちらか一方だけを持つ
      - 版は変更しない（変えるときは新しい版を作る）
      - 記録から戻すときは中身を検査しない（その時点の設定の候補が変わっていても復元できる）
    behaviors:
      - 写真風の生成画像を含むか返す（投稿画像一覧かスライド構成に委ねる）
      - 承認時の確認が要るか返す（同上）
      - 公開用キャプションを作る（投稿の型の設定の版・AI生成の表示とあわせて）
      - 下書き案の文言を取り込んだ新しい版を返す（スライド構成に委ねる。素材画像・背景写真は保つ。修正指示の再生成で使う）
      - 公開用画像が何枚になるか返す（投稿画像一覧の枚数か、スライド構成の枚数）
      - 公開用画像の準備のしかたを返す（アップロードの投稿は公開用の保存先への複製、テンプレートの投稿は画像化）
      - 画像化に必要な画像の参照の一覧を返す（背景写真・素材画像。過去の投稿の表紙は承認から受け取る）
    related: [投稿, 投稿画像一覧, スライド構成, テンプレート, キャプション, PR区分, 投稿の型の設定]
    avoid: [リビジョン情報]

  - name_ja: 過去の投稿の表紙
    code_name: PastPostCover
    kind: value
    definition: 最後のスライドに載せる、過去に公開した投稿1件。投稿IDと、その投稿の表紙の画像（アップロードの投稿は投稿画像の1枚目、テンプレートの投稿は画像化した1枚目）。承認のたびに選び、その承認に結び付けて記録する
    invariants:
      - 公開済みの投稿で、載せる投稿自身ではない
    behaviors:
      - 承認した時点で公開済みの投稿から、公開日時が新しい順に最大2件を選ぶ（0〜2件）
    related: [投稿, 公開結果, 投稿画像, 最後のスライドの中身]
    avoid: [投稿データ, PostInfo, 記事]

  - name_ja: 投稿種別
    code_name: PostFormat
    kind: kubun
    definition: フィード投稿の形式
    values:
      - {code: FEED_IMAGE, name_ja: 画像}
      - {code: CAROUSEL, name_ja: カルーセル}
    behaviors:
      - 投稿画像の枚数範囲を返す（画像=1枚、カルーセル=2〜10枚。テンプレートの投稿はスライド構成が3〜10枚なので常にカルーセル）
      - Instagramへの公開手順を選ぶ（カルーセルは子コンテナを先に作る）

  - name_ja: 投稿画像
    code_name: PostMedia
    kind: value
    definition: 投稿に含まれる1枚の画像。順番・保存先・幅・高さを持つ
    invariants:
      - 順番は1以上
      - 画像仕様を満たす
    behaviors:
      - アスペクト比を返す
    related: [画像仕様]

  - name_ja: 投稿画像一覧
    code_name: PostMediaList
    kind: collection
    definition: 1つの投稿の投稿画像の並び
    invariants:
      - 順番が1から連番
      - カルーセルの場合、全画像のアスペクト比が1枚目と同じ
    behaviors:
      - 枚数が投稿種別の範囲内かを判断する
      - 1枚目のアスペクト比を返す

  - name_ja: 画像仕様
    code_name: ImageSpec
    kind: rule
    definition: Instagram APIで公開できる画像の条件
    invariants:
      - 形式はJPEG（Graph APIの画像投稿はJPEGのみ）
      - 8MB以下
      - アスペクト比 4:5（0.8）〜 1.91:1
      - 幅 320〜1440px
    behaviors:
      - 画像が仕様を満たすか判断し、満たさない項目を返す

  - name_ja: キャプション
    code_name: Caption
    kind: value
    definition: 人や AI が書く投稿の本文（ハッシュタグを含んでよい）。テンプレートの投稿では2〜3段落の本文で、キャプションの定型・固定ハッシュタグ・追加のハッシュタグは含まない（公開用キャプションで足す）
    invariants:
      - 2,200文字以下、ハッシュタグは30個以下（付記を足した上限は公開用キャプションが確かめる）
    behaviors:
      - 含まれるハッシュタグを数える
    related: [ハッシュタグ, 公開用キャプション]

  - name_ja: 公開用キャプション
    code_name: PublishCaption
    kind: value
    definition: |
      Instagram に公開する文。組み立てはここ1か所だけで行う:
      PR表記（PR案件のみ）→ キャプション → AI生成の表示（要るときのみ）→ キャプションの定型（テンプレートの投稿のみ）→
      ハッシュタグ（固定ハッシュタグ＋追加のハッシュタグ。重複は除く。テンプレートの投稿のみ）
    invariants:
      - 2,200文字以下、ハッシュタグは30個以下（コードポイントで数える）
    behaviors:
      - 組み立てる（材料は 投稿の版・投稿の型の設定の版・AI生成の表示）
      - 上限を超えるとき、付けた付記の名前（PR表記・AI生成の表示・キャプションの定型・ハッシュタグ）と文字数を添えた違反の説明を返す
      - キャプションに使える残りの文字数を返す（下書き案の生成時の検査と人の書き換えに使う）
    related: [キャプション, PR区分, AI生成の表示, キャプションの定型, 固定ハッシュタグ, 投稿の版]

  - name_ja: ハッシュタグ
    code_name: Hashtag
    kind: value
    definition: 「#」で始まる分類語
    invariants:
      - 「#」で始まり空白を含まない

  - name_ja: PR区分
    code_name: PrCategory
    kind: kubun
    definition: 対価を受けた広告（PR案件）かどうかの区分。ステルスマーケティング規制への対応
    values:
      - {code: NONE, name_ja: 通常}
      - {code: PR, name_ja: PR案件}
    behaviors:
      - 公開用キャプションにPR表記を付ける（PR案件のみ。表記の文言は要確認）
      - PR表記が必要かを返す

  - name_ja: 予約日時
    code_name: ScheduledAt
    kind: value
    definition: 公開してほしい日時（日本時間で入力、タイムゾーン付きで保持）
    invariants:
      - 予約を確定する時点で現在より後、かつ1年以内（確定用の生成 decide）
      - 例外として、失敗の再実行の「今すぐ」は確定時点の現在時刻（immediate）
      - 記録から復元するときは検査しない（restore。公開時には過去なのが正常）
    behaviors:
      - 公開してよい時刻になったか判断する
      - 公開猶予を過ぎたか判断する（公開猶予に委ねる）

  - name_ja: 公開猶予
    code_name: PublishGrace
    kind: rule
    definition: 予約日時を過ぎてから自動公開してよい最大の遅れ。超えたら人に判断を戻す
    invariants:
      - 既定6時間（要確認）
    behaviors:
      - 予約日時と現在時刻から、自動公開してよいかを判断する

  - name_ja: 投稿状態
    code_name: PostStatus
    kind: state
    definition: 投稿の進行状況。投稿履歴から導出する
    values:
      - {code: DRAFT, name_ja: 下書き}
      - {code: AWAITING_APPROVAL, name_ja: 承認待ち}
      - {code: SCHEDULED, name_ja: 予約中}
      - {code: PUBLISHING, name_ja: 公開処理中}
      - {code: PUBLISHED, name_ja: 公開済み}
      - {code: FAILED, name_ja: 失敗}
      - {code: DISCARDED, name_ja: 破棄}
    transitions:
      DRAFT: [AWAITING_APPROVAL, DISCARDED]
      AWAITING_APPROVAL: [SCHEDULED, DRAFT, DISCARDED]
      SCHEDULED: [PUBLISHING, DRAFT, FAILED]
      PUBLISHING: [PUBLISHED, FAILED, SCHEDULED]   # SCHEDULED: 上限超過で次の定期処理に回す（公開延期）
      PUBLISHED: []
      FAILED: [SCHEDULED, DRAFT, DISCARDED]
      DISCARDED: []
    behaviors:
      - 遷移できるか判断する
      - 編集できるか（下書きのみ）
      - カレンダーでの色区分を返す

  - name_ja: 投稿履歴
    code_name: PostEvent
    kind: event
    category: koto
    definition: 投稿に起きた出来事の記録（作成、承認依頼、承認、修正指示、予約取消、公開開始、公開延期、公開、失敗、再実行、下書きに戻す、破棄）。追記のみ。出来事の種類ごとに許される遷移が決まっている
    identity: 投稿履歴ID
    promises:
      do:
        - 誰が・いつ・何をしたかを残す
      dont:
        - 記録の変更・削除
    related: [投稿, 投稿状態, メンバー]

  - name_ja: 公開結果
    code_name: PublishResult
    kind: value
    definition: 公開に成功したときにInstagramから得た情報
    invariants:
      - メディアIDと公開日時は必須
    related: [投稿]

  - name_ja: 失敗理由
    code_name: FailureReason
    kind: value
    definition: 公開、または公開の準備（画像化・公開用画像の準備）に失敗した理由。失敗区分と人が読める説明
    invariants:
      - 説明は空でない
    related: [失敗区分]

  - name_ja: 失敗区分
    code_name: FailureKind
    kind: kubun
    definition: 失敗の種類。自動リトライの可否が変わる
    values:
      - {code: TRANSIENT, name_ja: 一時的なエラー}
      - {code: RATE_LIMITED, name_ja: 上限超過}
      - {code: TOKEN_INVALID, name_ja: 連携切れ}
      - {code: MEDIA_REJECTED, name_ja: 画像・内容の不備}
      - {code: GRACE_EXCEEDED, name_ja: 公開猶予切れ}
      - {code: RENDER_FAILED, name_ja: 画像化の失敗}
      - {code: UNKNOWN, name_ja: 不明}
    behaviors:
      - 同じジョブ内で自動リトライしてよいか（TRANSIENT, RATE_LIMITED のみ）
      - 画面に出す対処方法を返す

  # ───────── 定期処理 ─────────
  - name_ja: ジョブ
    code_name: Job
    kind: entity
    category: koto
    definition: 定期処理が行う1件の仕事（公開用画像の準備・公開・トークン更新など）。二重実行を防ぐ単位。公開用画像の準備は、テンプレートの投稿なら画像化、アップロード画像なら公開用の保存先への複製
    identity: ジョブID
    promises:
      do:
        - 同じ仕事は同時に1つの処理しか実行しない
        - 実行期限を過ぎた実行中ジョブは再実行可能に戻す
      dont:
        - 実行時刻ぴったりの開始
    invariants:
      - 試行回数は最大試行回数以下
    behaviors:
      - 実行権を取得する（期限付き）
      - 成功する／失敗する／再試行に回る
    related: [ジョブ種別, ジョブ状態, 投稿]

  - name_ja: ジョブ種別
    code_name: JobType
    kind: kubun
    definition: ジョブの種類
    values:
      - {code: PREPARE_MEDIA, name_ja: 公開用画像の準備}
      - {code: PUBLISH_POST, name_ja: 公開}
      - {code: REFRESH_TOKEN, name_ja: トークン更新}
      - {code: COLLECT_INSIGHTS, name_ja: インサイト収集}
      - {code: COLLECT_NEWS, name_ja: ネタ収集}
      - {code: GENERATE_DRAFTS, name_ja: 下書き一括生成}
    behaviors:
      - 最大試行回数を返す
      - 実行期限（ロックの長さ）を返す

  - name_ja: ジョブ状態
    code_name: JobStatus
    kind: state
    definition: ジョブの進行状況
    values:
      - {code: PENDING, name_ja: 待機}
      - {code: RUNNING, name_ja: 実行中}
      - {code: SUCCEEDED, name_ja: 成功}
      - {code: FAILED, name_ja: 失敗}
    transitions:
      PENDING: [RUNNING]
      RUNNING: [SUCCEEDED, FAILED, PENDING]
      SUCCEEDED: []
      FAILED: []

  - name_ja: バッチ稼働記録
    code_name: BatchHeartbeat
    kind: event
    category: koto
    definition: 定期処理が動いたことの記録。止まっていることの検知に使う
    identity: 稼働記録ID
    promises:
      do:
        - 定期処理の開始と終了を記録する
      dont:
        - 個々のジョブの成否の記録（ジョブで行う）

  - name_ja: 警告
    code_name: Alert
    kind: kubun
    definition: 管理画面のログイン時に表示する警告の種類。記録から導出し、保存しない
    values:
      - {code: TOKEN_EXPIRING, name_ja: トークン期限が近い}
      - {code: TOKEN_REFRESH_FAILED, name_ja: トークン更新失敗}
      - {code: CONNECTION_MISSING, name_ja: Instagram未連携}
      - {code: LLM_LIMIT_NEAR, name_ja: 生成上限が近い}
      - {code: LLM_LIMIT_REACHED, name_ja: 生成上限に到達}
      - {code: PUBLISH_FAILED, name_ja: 投稿失敗あり}
      - {code: BATCH_STOPPED, name_ja: 定期処理が止まっている}
      - {code: IMAGE_LIMIT_NEAR, name_ja: 画像生成の上限が近い}
      - {code: IMAGE_LIMIT_REACHED, name_ja: 画像生成の上限に到達}
    behaviors:
      - 重要度（エラー／注意）を返す
      - 表示文言と対処リンクを返す

  # ───────── AI 生成 ─────────
  - name_ja: テンプレート
    code_name: Template
    kind: entity
    category: mono
    definition: 新島infoの投稿の型（トンマナ）を表す HTML/CSS と描画スクリプト。リポジトリのファイルで版を管理し（ADR-0010）、版ごとに3つの役割のスライドを描ける。スライドの中身・投稿の型の設定・画像を受け取り、描画スクリプトが文言を文字として差し込む。画像化は投稿の版が記録したテンプレートの版で行う
    identity: テンプレートの版の名前（例 niijima@1）
    invariants:
      - 出力サイズは画像仕様を満たす（既定1080×1350）
      - 差し込み項目はスライドの中身と投稿の型の設定と画像だけ（文言は textContent で入れ、HTML として解釈しない）
      - 版は変更しない（変えるときは新しい版を作る。フォントも版に含める）
      - 各欄の上限文字数を最も幅の広い文字で埋めても枠からはみ出さない（NFR-002-05 のテストで確かめる）
    behaviors:
      - スライドを描く（強調する語は赤字にする。フォントと画像の読み込みを待ってから終わる）
    related: [スライド, スライド役割, 投稿の型の設定]

  - name_ja: スライド
    code_name: Slide
    kind: value
    definition: 投稿画像1枚分の内容。スライド役割と、その役割の中身（表紙の中身・中のスライドの中身・最後のスライドの中身のどれか）の組
    invariants:
      - 役割と中身の型が合う
    behaviors:
      - 画像化に必要な画像の参照の一覧を返す（実際にあるかは画像化の側で確かめ、無ければ画像化の失敗）
      - 写真風の生成画像を含むか返す（中身に委ねる）
    related: [スライド役割, 表紙の中身, 中のスライドの中身, 最後のスライドの中身]

  - name_ja: スライド役割
    code_name: SlideRole
    kind: kubun
    definition: カルーセル内でのスライドの役割。役割ごとに使うテンプレートと中身の型が決まる
    values:
      - {code: COVER, name_ja: 表紙}
      - {code: BODY, name_ja: 中のスライド}
      - {code: CLOSING, name_ja: 最後のスライド}
    behaviors:
      - 使うテンプレートを返す
      - 並び順を返す（表紙 → 中のスライド → 最後のスライド）
    avoid: [本文（→ 中のスライド。キャプション・ネタの本文と紛れる）, まとめ（→ 最後のスライド。締めの言葉「まとめたよ」と紛れる）]

  - name_ja: スライド構成
    code_name: SlideList
    kind: collection
    definition: テンプレートの投稿のスライドの並び。下書き案と投稿の版が持つ
    invariants:
      - 表紙1 → 中のスライド1〜8 → 最後のスライド1 の順（合計3〜10枚）
    behaviors:
      - 満たさない条件を列挙する（AI の出力にも、人が中のスライドを足し引きしたときにも同じ検査をかける）
      - 中のスライドを足す・外す（並びと枚数の条件を守る）
      - 下書き案の文言を取り込む（各スライドの素材画像・表紙の背景写真は保つ）
      - 写真風の生成画像を含むか・承認時の確認が要るか返す（各スライドに委ねる）
    related: [スライド, スライド役割, 下書き案, 投稿の版]

  - name_ja: 表紙の中身
    code_name: CoverContent
    kind: value
    definition: 表紙のスライドの中身。表紙の文言と背景写真（無ければ紺の単色）
    invariants:
      - 表紙の文言を持つ。背景写真は0〜1枚
    behaviors:
      - 背景写真を選び直した新しい中身を返す
    related: [表紙の文言, 背景写真]

  - name_ja: 中のスライドの中身
    code_name: BodyContent
    kind: value
    definition: 中のスライドの中身。スライドの文言・絵の指示・素材画像（無くてよい。無ければ文字だけのカード）
    invariants:
      - スライドの文言と絵の指示を持つ。素材画像は0〜1枚
    behaviors:
      - 素材画像を差し替えた・作った新しい中身を返す
      - 写真風の生成画像を含むか返す（素材画像に委ねる）
    related: [スライドの文言, 絵の指示, 素材画像]

  - name_ja: 最後のスライドの中身
    code_name: ClosingContent
    kind: value
    definition: 最後のスライドの中身。過去の投稿の表紙0〜2件（定型文とアカウントの紹介は投稿の型の設定から取る。AI は書かない）
    invariants:
      - 過去の投稿の表紙は0〜2件
    related: [過去の投稿の表紙, 投稿の型の設定]

  - name_ja: 表紙の文言
    code_name: CoverText
    kind: value
    definition: 表紙の3段に描く文言。対象・キーワード・添え書き・締めの言葉と、帯のアクセント色
    invariants:
      - 対象は投稿の型の設定の「表紙の対象の候補」のどれか
      - キーワードは1〜10文字、添え書きは0〜16文字、締めの言葉は1〜8文字（コードポイントで数える）
      - 記録から戻すときは検査しない（設定の候補が後で変わっても、過去の版を復元できる）
    behaviors:
      - 満たさない条件を列挙する（AI の出力にも人の書き換えにも同じ検査をかける）
    related: [アクセント色, 表紙の中身, 投稿の型の設定]

  - name_ja: スライドの文言
    code_name: SlideText
    kind: value
    definition: 中のスライドに描く見出し・説明文と、説明文の中で赤字にする強調する語
    invariants:
      - 見出しは1〜16文字、説明文は1〜120文字（コードポイントで数える）
      - 強調する語は0〜3か所。説明文に含まれる部分文字列で、互いに重ならない
    behaviors:
      - 満たさない条件を列挙する（AI の出力にも人の書き換えにも同じ検査をかける）
      - 説明文を、強調する部分とそれ以外に分けて返す（テンプレートが赤字に描く）
    related: [スライド]

  - name_ja: アクセント色
    code_name: AccentColor
    kind: kubun
    definition: 表紙の3段目の帯の色
    values:
      - {code: PURPLE, name_ja: 紫}
      - {code: RED, name_ja: 赤}
      - {code: TEAL, name_ja: 青緑}
    behaviors:
      - テンプレートで使う色の値を返す（値は公開中の投稿から読み取ったもの）

  - name_ja: 絵の指示
    code_name: PictureBrief
    kind: value
    definition: 中のスライドの素材画像を画像生成するための指示と、実在の素材（ロゴ・料金表・アプリの画面）への差し替えが必要かの印。AI が下書き案に含めて返し、人が直せる
    invariants:
      - 指示は画像生成の指示の条件を満たす（画像生成の指示に委ねる。固有名詞・商標を入れないことは AI への指示（プロンプト版）で守らせ、実物が要るスライドは差し替えが必要の印で人に回す）
    behaviors:
      - 画像生成の指示を返す
      - 差し替えが必要か返す
    related: [画像生成の指示, 素材画像, 中のスライドの中身]

  - name_ja: 素材画像
    code_name: MaterialImage
    kind: value
    definition: 中のスライドのカードに載せる画像。生成画像（候補を採用したもの）か、人が差し替えた画像
    invariants:
      - 生成画像か、人が差し替えた画像のどちらか一方
    behaviors:
      - 生成画像か返す（人が差し替えた画像は生成画像ではない）
      - AI生成の表示が要るか返す（写真風の生成画像のときだけ）
    related: [生成画像, 素材画像としての採用, 中のスライドの中身]
    avoid: [挿絵画像, カード画像]

  - name_ja: 背景写真
    code_name: BackgroundPhoto
    kind: entity
    category: mono
    definition: 表紙の背景に使う、団体が登録したキャンパスの写真。説明文をもとに AI が話題に合うものを選ぶ
    identity: 背景写真ID
    invariants:
      - 説明文は1〜100文字
    behaviors:
      - 候補になるか返す（「使わない」にした記録が無いときだけ）
    promises:
      do:
        - 使わなくなった写真も消さない（「使わない」にした出来事を追記する。既存の投稿の画像化には使える）
    related: [背景写真一覧, 表紙の中身, 団体]

  - name_ja: 背景写真一覧
    code_name: BackgroundPhotoList
    kind: collection
    definition: 団体が使っている背景写真の並び（「使わない」にしたものを除く）
    invariants:
      - 最大30枚
    behaviors:
      - 写真を足せるか判断する（30枚未満）
      - AI に渡す候補（写真IDと説明文）を返す
    related: [背景写真]

  - name_ja: 投稿の型の設定
    code_name: PostStyleSettings
    kind: entity
    category: mono
    definition: 団体ごとの投稿の型の固定の文言・候補と素材。上端の帯の文言・表紙の対象の候補・最後のスライドの定型文・アカウントの紹介・キャプションの定型・固定ハッシュタグ・ロゴ（Storage の画像。無くてよい。ADR-0010）。AI は書き換えない。版で管理する
    identity: 団体ID＋版
    invariants:
      - 表紙の対象の候補は1件以上
      - 固定ハッシュタグはハッシュタグの条件を満たす
      - 版は変更しない（変えるときは新しい版を作る）
      - 投稿の版は、使った設定の版を記録する（承認後に設定を変えても公開内容は変わらない）
    behaviors:
      - 表紙の対象の候補に含まれるか判断する
      - キャプションの定型を返す
      - 固定ハッシュタグを返す
    related: [キャプションの定型, 固定ハッシュタグ, テンプレート, 団体, 投稿の版]

  - name_ja: キャプションの定型
    code_name: CaptionFooter
    kind: value
    definition: キャプションの本文の後ろに毎回付ける締めの文（区切り線・『同志社生向けSNSメディア』・アカウントの紹介）
    invariants:
      - 空でない
    related: [キャプション, 投稿の型の設定]
    avoid: [フッター]

  - name_ja: 固定ハッシュタグ
    code_name: FixedHashtags
    kind: collection
    definition: 毎回付けるハッシュタグの並び（新島info は #同志社大学 #同志社）。AI が足すハッシュタグはこの後ろに付き、重複は除く
    behaviors:
      - AI が足したハッシュタグと合わせ、重複を除いた並びを返す
    related: [ハッシュタグ, 投稿の型の設定]

  - name_ja: 生成の入力
    code_name: GenerationInput
    kind: value
    definition: LLM に渡してよい項目だけを持つ入力（ネタの本文・今日の日付・投稿の型の設定の候補・背景写真の候補（IDと説明文）・アクセント色の候補・修正指示と現在の文言・修正で保つ中のスライドの枚数）。入稿者連絡先などの個人情報の欄を持たない
    invariants:
      - 個人情報の欄を持たない（型で保証する）
    behaviors:
      - プロンプト版に差し込む値を返す
    related: [ネタ, プロンプト版, 下書き案, 修正指示]

  - name_ja: 下書き案
    code_name: DraftProposal
    kind: value
    definition: AIが生成した投稿の案（スライド構成（表紙の文言・中のスライドの文言と絵の指示）・キャプション・追加のハッシュタグ・PR区分・参照元URL）。生成の出力で、書き換えない。人の手直しは、取り込んだ投稿の版に対して行う
    invariants:
      - スライド構成の条件を満たす
      - 追加のハッシュタグは0〜5個
      - キャプションは、公開用キャプションの残りの文字数に収まる（生成の時点では、AI生成の表示の18文字を常に見込む）
      - 参照元URLは、ネタの出どころがニュースの場合は1件以上
    behaviors:
      - 満たさない条件を列挙する（再生成方針に渡す）
    related: [スライド構成, キャプション, PR区分, 絵の指示, 公開用キャプション]

  - name_ja: 生成
    code_name: Generation
    kind: event
    category: koto
    definition: LLMに下書き案を作らせた1回の出来事。入力・出力・プロンプト版・生成経路・その後の承認／修正の結果を残す。画像を作る出来事は「画像生成」で、これとは別（画像生成の指示の英訳もこれには含めない）
    identity: 生成ID
    avoid: [画像の生成（→ 画像生成）]
    promises:
      do:
        - 入力と出力をそのまま残し、品質改善と分析に使えるようにする
        - 入稿者連絡先などの個人情報を入力に含めない
      dont:
        - 出力内容の事実性の保証（人の承認で担保する）
    related: [プロンプト版, 生成経路, 下書き案, 修正指示]

  - name_ja: 生成経路
    code_name: GenerationRoute
    kind: kubun
    definition: 下書き案をどうやって得たか
    values:
      - {code: API, name_ja: Gemini API}
      - {code: MANUAL, name_ja: 手動コピペ}
    behaviors:
      - LLM利用回数を数えるか（APIのみ）

  - name_ja: プロンプト版
    code_name: PromptVersion
    kind: entity
    category: mono
    definition: 用途ごとのプロンプト本文の1つの版。用途ごとに有効な版は1つ
    identity: プロンプト版ID
    invariants:
      - 版番号は用途ごとに1から連番
      - 本文は変更しない（変えるときは新しい版を作る）
    related: [プロンプト用途]

  - name_ja: プロンプト用途
    code_name: PromptPurpose
    kind: kubun
    definition: プロンプトの使い道
    values:
      - {code: PLAN, name_ja: 企画生成}
      - {code: CAPTION, name_ja: キャプション生成}
      - {code: REVISE, name_ja: 修正指示による再生成}
    behaviors:
      - 出力のJSONスキーマを返す

  - name_ja: 再生成方針
    code_name: GenerationRetryPolicy
    kind: rule
    definition: LLMの出力が下書き案の条件を満たさなかったとき、違反内容を添えて作り直してよいかの判断
    invariants:
      - 1回の依頼につき作り直しは1回まで
    behaviors:
      - 作り直してよいか判断する（違反があり、まだ作り直していない）
      - 作り直しのときにLLMへ渡す違反の説明を作る

  - name_ja: 修正指示
    code_name: RevisionInstruction
    kind: value
    definition: 承認者・編集者が自然文で出す直してほしい点（例「もっとくだけた感じで」）
    invariants:
      - 1〜500文字

  - name_ja: LLM利用回数
    code_name: LlmUsage
    kind: aggregate
    category: koto
    definition: 団体・日付・モデルごとのLLM呼び出し回数。無料枠の上限管理に使う
    identity: 団体ID＋日付（太平洋時間）＋モデル名
    promises:
      do:
        - 呼び出し前に1回分を確保し、上限を超える呼び出しをさせない
      dont:
        - Google側の実際の残量との一致（自前の数え方で控えめに止める）
    behaviors:
      - 1回分を確保する（上限到達なら拒否）
      - 上限に近いか判断する
    related: [LLM上限]

  - name_ja: LLM上限
    code_name: LlmQuota
    kind: value
    definition: 1日に使ってよいLLM呼び出し回数と、警告を出す割合
    invariants:
      - 上限は1以上
      - 警告割合は0より大きく1以下（既定0.8）

  # ───────── 企画・承認・PR ─────────
  - name_ja: ネタ
    code_name: Idea
    kind: entity
    category: koto
    definition: 投稿の元になる情報。運営メモ・大学ニュース・PR入稿のどれかから生まれる
    identity: ネタID
    promises:
      do:
        - 出どころと、ニュースなら参照元URLを必ず残す
      dont:
        - 投稿になることの保証（使うかは人が決める）
        - 公式サイトの文章・画像の保持（事実だけを持つ）
    invariants:
      - 本文は1〜2,000文字
      - ネタの出どころがニュースなら参照元URLを持つ
    behaviors:
      - 投稿に使われた／見送られた
    related: [ネタの出どころ]

  - name_ja: ネタの出どころ
    code_name: IdeaSource
    kind: kubun
    definition: ネタがどこから来たか
    values:
      - {code: MEMO, name_ja: 運営メモ}
      - {code: NEWS, name_ja: 大学ニュース}
      - {code: PR, name_ja: PR入稿}
    behaviors:
      - 生成した投稿のPR区分の初期値を返す（PR入稿ならPR案件）
      - PR区分を通常に変えられないか（PR入稿なら変えられない。画面・一括生成・公開直前の3か所で検査する）
      - 参照元URLが必須か

  - name_ja: PR入稿
    code_name: PrSubmission
    kind: aggregate
    category: koto
    definition: サークル・企業が入稿フォームから送った掲載依頼
    identity: PR入稿ID
    promises:
      do:
        - 採用したらネタ（出どころ=PR入稿）を作る
        - 入稿者連絡先をLLMに渡さない
      dont:
        - 掲載や希望日どおりの公開の保証（採否は承認者が決める）
    invariants:
      - 文面は1〜2,000文字、画像は0〜10枚
    behaviors:
      - 採用する／不採用にする
    related: [入稿者連絡先, 採否, ネタ]

  - name_ja: 入稿者連絡先
    code_name: SubmitterContact
    kind: value
    definition: PR入稿者の団体名・担当者名・連絡先。個人情報として扱う
    invariants:
      - メールアドレスの形式が正しい
      - LLMへの入力に含めない

  - name_ja: 採否
    code_name: SubmissionDecision
    kind: state
    definition: PR入稿の判断状況
    values:
      - {code: RECEIVED, name_ja: 受付}
      - {code: ACCEPTED, name_ja: 採用}
      - {code: REJECTED, name_ja: 不採用}
    transitions:
      RECEIVED: [ACCEPTED, REJECTED]
      ACCEPTED: []
      REJECTED: []

  - name_ja: 自動チェック
    code_name: AutoCheck
    kind: rule
    definition: 承認前に投稿内容を機械的に検査する規則の集まり。結果は警告として出し、承認を止めない
    behaviors:
      - 投稿を検査してチェック結果の一覧を返す
    related: [チェック項目, チェック結果]

  - name_ja: チェック項目
    code_name: CheckKind
    kind: kubun
    definition: 自動チェックの検査項目
    values:
      - {code: PR_SUSPECTED, name_ja: PR案件の可能性}
      - {code: DATE_WEEKDAY_MISMATCH, name_ja: 日付と曜日の矛盾}
      - {code: PERSONAL_NAME, name_ja: 個人名の可能性}
      - {code: NG_EXPRESSION, name_ja: NG表現}
      - {code: IMAGE_SPEC, name_ja: 画像仕様違反}
      - {code: SOURCE_URL_MISSING, name_ja: 参照元URLなし}
      - {code: UNSUPPORTED_FACT, name_ja: ネタに無い情報}   # 文言の日付・時刻・金額・URL がネタの本文に無い（REQ-002 BR-002-10。表記ゆれは揃えて比べる）
    behaviors:
      - 重要度を返す（画像仕様違反はエラー、他は注意）

  - name_ja: チェック結果
    code_name: CheckFinding
    kind: value
    definition: 自動チェックで見つかった1件の指摘
    invariants:
      - チェック項目とメッセージは必須

  - name_ja: NG表現
    code_name: NgExpression
    kind: value
    definition: 団体が登録した、投稿に使わない言葉
    invariants:
      - 1〜50文字

  # ───────── 収集・分析 ─────────
  - name_ja: ニュースソース
    code_name: NewsSource
    kind: entity
    category: mono
    definition: 大学公式サイトの、ネタ収集の対象とするRSSまたはページ
    identity: ニュースソースID
    invariants:
      - 取得方式はRSSまたはページ差分

  - name_ja: インサイト
    code_name: InsightSnapshot
    kind: event
    category: koto
    definition: ある日に取得した、公開済み投稿1件の反応の数値（リーチ・保存数・シェア数など）
    identity: 投稿ID＋取得日
    promises:
      do:
        - 1投稿1日1件、追記で残す
      dont:
        - Instagram側が後から補正した数値の遡り反映
    related: [投稿]

  - name_ja: ジャンル
    code_name: Genre
    kind: value
    definition: 投稿の内容の分類（例 イベント、締切リマインド、サークル紹介）。団体が定義する
    invariants:
      - 1〜20文字

  - name_ja: 伸びた投稿
    code_name: StandoutPost
    kind: rule
    definition: 企画生成で「良い例」として渡す過去の投稿。直近90日の公開済み投稿のうち、リーチあたり保存数の上位（要確認）
    behaviors:
      - 公開済み投稿とインサイトから上位N件を選ぶ

  # ───────── AI 画像生成（REQ-005） ─────────
  - name_ja: 画像生成
    code_name: ImageGeneration
    kind: event
    category: koto
    definition: 画像生成の指示から、画像生成の提供元に候補を作らせた1回の出来事。LLM に下書き案を作らせる「生成」とは別
    identity: 画像生成ID
    promises:
      do:
        - 指示・英訳した指示・画像の種類・提供元とモデル名・結果（成功／失敗）・作った候補の数・依頼したメンバー・日時を残す
        - 個人情報を含む指示は提供元に送らず、記録もしない
      dont:
        - 作った画像が事実を写していることの保証（写真風はイメージ写真としてだけ使う）
        - 採用されなかった候補の画像を残すこと
    invariants:
      - 1回の画像生成で作る候補は最大4枚（0枚なら結果は失敗）
    behaviors:
      - 候補を作る（成功）／失敗する
    related: [画像生成の指示, 画像の種類, 候補, 画像生成の提供元, 画像生成の回数]
    avoid: [AI画像生成ログ, ImageGenerationInfo]

  - name_ja: 画像生成の指示
    code_name: ImagePrompt
    kind: value
    definition: 画像生成で作ってほしい画像を言葉で表したもの（日本語）。提供元へは英訳して渡す
    invariants:
      - 1〜500文字
      - メールアドレス・電話番号の形式を含まない
      - その投稿の元になった PR入稿の入稿者連絡先を含まない
    behaviors:
      - 個人を特定できる情報を含むか判断する
    related: [画像生成, 入稿者連絡先]
    avoid: [プロンプト（LLM のプロンプト版と紛らわしい）]

  - name_ja: 画像の種類
    code_name: ImageStyle
    kind: kubun
    definition: 画像生成で作る画像の見た目の種類。種類ごとに開示と確認の扱いが変わる
    values:
      - {code: ILLUSTRATION, name_ja: 背景・イラスト}
      - {code: PHOTOREALISTIC, name_ja: 写真風}
    behaviors:
      - 生成時に注意書きを出すか（写真風のみ）
      - 承認時に確認表示を出すか（写真風のみ）
      - 公開時にAI生成の表示を付けるか（写真風のみ）
      - Instagram の AI info（is_ai_generated）を付けるか（写真風のみ）
    related: [生成画像, AI生成の表示]

  - name_ja: 候補
    code_name: ImageCandidate
    kind: value
    definition: 画像生成で作られ、まだ採用されていない画像。採用されなければ残さない
    invariants:
      - どの画像生成の何番目の候補かを持つ（1〜4）
    behaviors:
      - 採用されて生成画像になる
      - 放置されたか判断する（画像生成から24時間を過ぎたら、片付けられていなくても消してよい）
    related: [画像生成, 候補の採用, 生成画像]

  - name_ja: 候補の採用
    code_name: CandidateAdoption
    kind: event
    category: koto
    definition: 候補を投稿の版の投稿画像として保存した出来事（REQ-005）。投稿の版の保存と同じ時点に記録し、その投稿画像に結び付く（画像生成とは別の時点に起きる）。中のスライドの素材画像として入れるのは「素材画像としての採用」で、これとは別
    identity: 投稿画像ID（投稿画像1枚に1つ）
    promises:
      do:
        - どの画像生成のどの候補を、どの投稿（の版の投稿画像）に、誰がいつ入れたかを残す
        - 採用できる候補だけを受け付ける
      dont:
        - 採用を取り消したことの記録（投稿画像から外すのは投稿の版の変更で表す）
        - 投稿を一度も保存しなかった候補の記録（採用されなかったことになる）
    related: [候補, 生成画像, 投稿, メンバー, 採用できる候補]

  - name_ja: 素材画像としての採用
    code_name: MaterialAdoption
    kind: event
    category: koto
    definition: 候補を投稿の版の中のスライドの素材画像として保存した出来事（REQ-002）。投稿の版の保存と同じ時点に記録し、そのスライドに結び付く
    identity: スライドID（中のスライド1枚に1つ）
    promises:
      do:
        - どの画像生成のどの候補を、どの投稿（の版のスライド）に、誰がいつ入れたかを残す
        - 採用できる候補だけを受け付ける
      dont:
        - 採用を取り消したことの記録（素材画像を外すのは投稿の版の変更で表す）
    related: [候補, 生成画像, 素材画像, 投稿の版, 採用できる候補]

  - name_ja: 採用できる候補
    code_name: AdoptableCandidate
    kind: rule
    definition: 投稿画像・素材画像として採用してよい候補の条件。2つの採用が共通に使う
    behaviors:
      - 自団体の成功した画像生成の、候補の数以内の位置か判断する（撮った写真や他団体の画像が生成画像に化けない）
    related: [候補の採用, 素材画像としての採用, 画像生成]

  - name_ja: 生成画像
    code_name: GeneratedImage
    kind: value
    definition: 採用されて投稿画像、または中のスライドの素材画像になった候補。画像の種類を持つ。投稿画像としては画像仕様を満たす
    invariants:
      - 画像の種類を持つ
      - 採用した候補の画像生成を辿れる
    behaviors:
      - AI生成の表示が必要かを返す（画像の種類に委ねる）
    related: [投稿画像, 素材画像, 画像の種類, 候補の採用, 素材画像としての採用]
    avoid: [AI画像, AI写真]

  - name_ja: AI生成の表示
    code_name: AiDisclosure
    kind: rule
    definition: 写真風の生成画像（投稿画像そのもの、または中のスライドの素材画像）を含む投稿を公開するときに付ける開示。キャプションの定型文と、Instagram の AI info
    invariants:
      - 定型文は「※画像はAIで生成したイメージです」。前に改行1つを挟む（改行込み18文字）。どこに入れるかは公開用キャプションが決める
    behaviors:
      - 投稿の版から、付けるべきか判断する（写真風の生成画像を投稿画像か素材画像に1枚でも含むとき）
      - 付ける文字列を返す（要らなければ空）
    related: [生成画像, 画像の種類, キャプション, PR区分]

  - name_ja: 画像生成の回数
    code_name: ImageGenerationUsage
    kind: aggregate
    category: koto
    definition: 団体・日（日本時間 9:00 から翌 9:00）ごとの画像生成の回数。候補4枚を作る1回を1回と数える。無料枠の範囲で使うために数える
    identity: 団体ID＋日（日本時間 9:00 区切り）
    promises:
      do:
        - 画像生成の前に1回分を確保し、上限を超える画像生成をさせない
      dont:
        - 提供元側の実際の残量との一致（自前で控えめに数える）
    behaviors:
      - 1回分を確保する（上限到達なら拒否）
      - 上限に近いか判断する（8割）
    related: [画像生成の上限, 画像生成, 団体]

  - name_ja: 画像生成の上限
    code_name: ImageGenerationQuota
    kind: value
    definition: 1日に画像生成してよい回数と、警告を出す割合（団体の設定値）
    invariants:
      - 上限は1以上（仮置き20）
      - 警告割合は0より大きく1以下（既定0.8）
    related: [画像生成の回数]

  - name_ja: 画像生成の提供元
    code_name: ImageGenerator
    kind: value
    definition: 画像を作る外部サービスとモデル名の組（団体の設定値）。LLM の提供元・モデルとは別に設定する
    invariants:
      - 提供元とモデル名は空でない
    related: [画像生成, 団体]
    avoid: [提供元（LLM と紛らわしい）]
