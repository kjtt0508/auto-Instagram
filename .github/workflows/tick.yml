# 15分ごとの定期処理（REQ-001 設計 6.1）: ジョブの回収 → 公開用画像の準備 → 公開
# 公開リポジトリ（ADR-0001）。秘密情報は Secrets のみ、ログには ID・件数・区分しか出さない。
name: tick
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}

concurrency: { group: tick, cancel-in-progress: false }

permissions: { contents: read }

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ジョブの開始時刻を記録する。Java の持ち時間は、ここ（timeout-minutes の起点）から数える（TickScenario）。
      # timeout-minutes を変えたら TickScenario.WORKFLOW_TIMEOUT も揃える。
      - id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # ソースが変わっていなければ前回の jar を使い、毎回のビルドを省く
      - id: jar
        uses: actions/cache@v4
        with:
          path: backend/target/batch.jar
          key: batch-jar-${{ hashFiles('backend/pom.xml', 'backend/src/main/**', 'templates/**') }}
      - if: steps.jar.outputs.cache-hit != 'true'
        run: ./mvnw -B -q -DskipTests package
        working-directory: backend
      # テンプレートの画像化（Playwright の chromium）。ブラウザは版ごとにキャッシュし、無いときだけ入れる（REQ-002 設計 6章）
      # 外部の都合（ブラウザの配布元・apt）で失敗しても、写真の投稿の公開は止めない。
      # 画像化できないときだけ、アプリ側が一時的な失敗として扱う（MediaPreparation）。
      # Maven のキャッシュ（~/.m2）には依存せず、pom と同じ版の Playwright を npx で入れる。
      # 入れ終わったときだけキャッシュに保存する（失敗した中途半端な状態を残さない）。
      - id: playwright_version
        run: echo "version=$(sed -n 's:.*<playwright.version>\(.*\)</playwright.version>.*:\1:p' backend/pom.xml)" >> "$GITHUB_OUTPUT"
      # キャッシュのキーに OS とランナーイメージの版を含める（ブラウザが使う OS のライブラリはキャッシュに入らないため、
      # イメージが変わったら入れ直す）。
      - id: playwright
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.playwright_version.outputs.version }}
      - id: playwright_install
        if: steps.playwright.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: npx -y playwright@${{ steps.playwright_version.outputs.version }} install --with-deps chromium
      # キャッシュが当たったときも、OS のライブラリ（ブラウザ本体以外）は毎回の実行環境に必要。
      # 失敗・固まりでも公開は止めない（手順ごとに 3 分で打ち切り、java -jar の持ち時間を残す）。
      - if: steps.playwright.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: npx -y playwright@${{ steps.playwright_version.outputs.version }} install-deps chromium
      - if: steps.playwright.outputs.cache-hit != 'true' && steps.playwright_install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.playwright_version.outputs.version }}
      - run: java -jar target/batch.jar --job=tick --run-id=${{ github.run_id }} --workflow-started-at=${{ steps.started.outputs.epoch }}
        working-directory: backend
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENC_KEY_V1: ${{ secrets.TOKEN_ENC_KEY_V1 }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
