# [任意アダプタ] PHP: composer require --dev deptrac/deptrac → vendor/bin/deptrac analyse
deptrac:
  paths: [./src, ./app]
  layers:
    - { name: Domain, collectors: [{ type: directory, value: '.*/Domain/.*' }] }
    - { name: Application, collectors: [{ type: directory, value: '.*/Application/.*' }] }
    - { name: Presentation, collectors: [{ type: directory, value: '.*/(Presentation|Http|Controllers)/.*' }] }
    - { name: Infrastructure, collectors: [{ type: directory, value: '.*/(Infrastructure|Models)/.*' }] }
    - { name: Framework, collectors: [{ type: classNameRegex, value: '#^(Illuminate|Symfony|Doctrine)\\#' }] }
  ruleset:
    Presentation: [Application, Domain, Framework]
    Application: [Domain]
    Infrastructure: [Application, Domain, Framework]
    Domain: []
