language: typescript
domain_forbidden_imports:
  - '^(react|react-dom|next|vue|nuxt|svelte|@angular/)(/|$)'
  - '^(axios|swr|ky|got|node-fetch|@tanstack/)'
  - '^(express|koa|fastify|hono|@nestjs/)'
  - '^(typeorm|@prisma/|prisma|mongoose|sequelize|drizzle-orm|knex)'
rules:
  - id: ts.fetch
    principle: P16
    severity: error
    layers: [domain]
    pattern: '\bfetch\s*\(|\bXMLHttpRequest\b|\blocalStorage\b|\bdocument\.|\bwindow\.'
    message: ドメインで I/O・ブラウザAPIを使っている。外側の層へ
  - id: ts.return-null
    principle: P13
    severity: error
    layers: [domain]
    pattern: '\breturn\s+null\b'
    message: null を返さない。Result 型や『未設定』を表す型を使う
  - id: ts.setter
    principle: P12
    severity: error
    layers: [domain]
    pattern: '^\s*((public|protected|private|static)\s+)*set\s+\w+\s*\('
    message: setter 禁止。業務の言葉のメソッドで新しいオブジェクトを返す
  - id: ts.export-let
    principle: P06
    severity: error
    layers: [domain]
    pattern: '^\s*export\s+(let|var)\b'
    message: モジュールレベルの可変状態を公開しない
  - id: ts.mutable-property
    principle: P06
    severity: error
    layers: [domain]
    member_of: '\bclass\b'
    pattern: '^\s*((public|private|protected)\s+)?(?!readonly\b|static\b|constructor\b|get\b|set\b|async\b|return\b|declare\b|abstract\b)#?\w+[?!]?\s*[:=][^(]*;?\s*$'
    unless_line: '=>|\breadonly\b'
    message: クラスのプロパティは readonly に（不変）
  - id: ts.getters
    principle: P12
    severity: warn
    layers: [domain]
    count_over: getter_warn
    pattern: '^\s*((public|static)\s+)*get\s+\w+\s*\('
    message: getter が {count} 個。値を取り出して外で判断していないか
  - id: ts.any
    principle: P05
    severity: warn
    layers: [domain]
    pattern: ':\s*any\b|as\s+any\b'
    message: any は型による業務の表現を放棄している
  - id: ts.kubun-branch
    principle: P09
    severity: warn
    layers: [domain, application, presentation]
    pattern: '\bswitch\s*\(|[=!]==\s*\w+\.[A-Z][A-Z0-9_]+\b'
    message: 区分による分岐。区分ごとの振る舞いをオブジェクト/マップに持たせられないか
  - id: ts.static-method
    principle: P27
    severity: warn
    layers: [domain]
    pattern: '^\s*((public|private|protected)\s+)?static\s+(?!readonly\b)(?!(of|from|create\w*|parse\w*|zero|empty|none)\b)\w+\s*[(<]'
    message: インスタンス変数を使わない static メソッド。処理するデータを持つクラスのメソッドにする
  - id: ts.domain-function
    principle: P27
    severity: warn
    layers: [domain]
    pattern: '^\s*export\s+(async\s+)?function\s+(?!(create|make|of|from|parse)\w*\b)\w+\s*\([^)]*\b\w+\s*:\s*[A-Z]\w*'
    message: ドメインオブジェクトを引数に取る関数。データを持つ型のメソッドにできないか（データとロジックを一緒に）
