spring.application.name=niijimaig-batch
spring.main.web-application-type=none
spring.main.banner-mode=off

# DB（Supabase。GitHub Actions からは IPv4 で届くプーラーのセッションモードを使う。値は GitHub Secrets）
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

# マイグレーションは定期処理では流さない（人の確認つきの migrate ワークフローで流す）
spring.flyway.enabled=${RUN_MIGRATIONS:false}

niijimaig.supabase-url=${SUPABASE_URL:}
niijimaig.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
niijimaig.instagram-graph-base=https://graph.instagram.com
niijimaig.ig-api-version=${IG_API_VERSION:v23.0}
niijimaig.token-key-v1=${TOKEN_ENC_KEY_V1:}

# 公開リポジトリのため、ログに SQL のパラメータや HTTP の中身を出さない
logging.level.root=INFO
logging.level.org.springframework.jdbc=WARN
